<title>Eleição Presidencial 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra fixa com trilha de navegação (Brasil › UF › município) e coluna única de seções;

:root {
  --bg: #f6f7f5;
  --surface: #ffffff;
  --surface-2: #eef0ec;
  --ink: #111512;
  --ink-2: #4b524c;
  --muted: #7d847e;
  --grid: #e3e6e1;
  --axis: #c3c8c1;
  --line: rgba(17, 21, 18, 0.12);
  --accent: #1d7a4c;
  --accent-ink: #ffffff;
  --lula: #e34948;
  --flavio: #2a78d6;
  --renan: #1baf7a;
  --cury: #eda100;
  --caiado: #6250d6;
  --zema: #e87ba4;
  --outros: #a29f95;
  --branco: #cfcdc4;
  --nulo: #8f8c84;
  --abst: #4f4d48;
  --up: #b4501f;
  --down: #12796a;
  --mid: #eceae4;
  --ok: #0ca30c;
  --atencao: #fab219;
  --grave: #d03b3b;
  --f-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101311; --surface: #171b18; --surface-2: #1f2420; --ink: #eef1ec; --ink-2: #c0c7bf; --muted: #8b928b;
    --grid: #262c27; --axis: #3a413b; --line: rgba(255, 255, 255, 0.11); --accent: #3fb07a; --accent-ink: #0b1a11;
    --lula: #e66767; --flavio: #3987e5; --renan: #199e70; --cury: #c98500; --caiado: #9085e9; --zema: #d55181;
    --outros: #7d7a72; --branco: #5d5b55; --nulo: #8f8c84; --abst: #c9c6bc; --up: #e07a45; --down: #2fb39f; --mid: #33362f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101311; --surface: #171b18; --surface-2: #1f2420; --ink: #eef1ec; --ink-2: #c0c7bf; --muted: #8b928b;
  --grid: #262c27; --axis: #3a413b; --line: rgba(255, 255, 255, 0.11); --accent: #3fb07a; --accent-ink: #0b1a11;
  --lula: #e66767; --flavio: #3987e5; --renan: #199e70; --cury: #c98500; --caiado: #9085e9; --zema: #d55181;
  --outros: #7d7a72; --branco: #5d5b55; --nulo: #8f8c84; --abst: #c9c6bc; --up: #e07a45; --down: #2fb39f; --mid: #33362f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, td.n, th.n { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); font-size: 0.86em; }

.topo { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topo-in { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 8px 22px; padding-block: 10px 0; }
.marca { font-family: var(--f-display); font-weight: 800; font-stretch: 75%; font-size: 20px; letter-spacing: 0.01em; text-decoration: none; color: var(--ink); white-space: nowrap; }
.marca span { color: var(--accent); }
.nav-aud { font-size: 14px; font-weight: 600; text-decoration: none; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; white-space: nowrap; }

.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); white-space: nowrap; }
.status i { font-style: normal; width: 16px; height: 16px; border-radius: 50%; display: inline-grid; place-content: center; font-size: 11px; color: #111512; background: var(--c); }
.testes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr)); gap: 12px; }
.teste { border: 1px solid var(--line); border-radius: 10px; padding: 14px; background: var(--bg); display: grid; gap: 6px; align-content: start; }

.teste p { margin: 0; font-size: 13.5px; color: var(--ink-2); }
.chip { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); margin: 1px 3px 1px 0; white-space: nowrap; }
.filtro-uf { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; position: sticky; top: calc(var(--topo-h, 96px) + var(--sum-h, 0px)); z-index: 4; background: var(--bg); padding-block: 8px; border-bottom: 1px solid var(--line); }
.filtro-uf select, #sel-ano-mun { padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.passos { margin: 0; padding-left: 20px; display: grid; gap: 6px; color: var(--ink-2); max-width: 82ch; }
.trilha { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 12.5px; color: var(--muted); min-width: 0; }

.placar { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: grid; gap: 14px; }
.placar-nomes { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.placar-nomes div { display: grid; gap: 0; }
.placar-nomes div:last-child { text-align: right; }
.placar-nomes strong { font-family: var(--f-display); font-stretch: 80%; font-weight: 800; font-size: clamp(28px, 4.4vw, 40px); line-height: 1; }
.placar-nomes span { color: var(--ink-2); font-size: 14px; }
.barra2 { display: flex; height: 14px; border-radius: 4px; overflow: hidden; gap: 2px; background: var(--surface); position: relative; }
.barra2 i { display: block; height: 100%; }
.barra2::after { content: ""; position: absolute; left: 50%; top: -4px; bottom: -4px; width: 1px; background: var(--ink); opacity: .5; }
.selo { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }
.selo::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--accent)); }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 4px; align-content: start; }
.kpi .rot { font-size: 13px; color: var(--ink-2); }

.delta-down { color: var(--down); font-weight: 600; }

.bloco { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; min-width: 0; }

.grade2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 20px; }
.grade2 > * { min-width: 0; }
.grafico { width: 100%; height: 360px; min-width: 0; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--bg); flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 12px; cursor: pointer; font-size: 13px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

.destaques { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 12px; }

.mini { display: flex; height: 10px; border-radius: 3px; overflow: hidden; gap: 2px; }
.mini i { display: block; height: 100%; min-width: 1px; }
.leg { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--ink-2); }
.leg span { display: inline-flex; align-items: center; gap: 5px; }
.leg span::before { content: ""; width: 10px; height: 10px; border-radius: 2px; background: var(--c); }
.leg b { color: var(--ink); font-variant-numeric: tabular-nums; }

.mapa-wrap { overflow-x: auto; }
.mapa { display: grid; grid-template-columns: repeat(7, minmax(48px, 1fr)); gap: 4px; min-width: 380px; max-width: 560px; }
.tile { aspect-ratio: 1 / 0.86; border: 0; border-radius: 6px; cursor: pointer; display: grid; place-content: center; text-align: center; padding: 2px; line-height: 1.1; }

.escala { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); flex-wrap: wrap; }

.tabela-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }

th, td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th { font-weight: 600; color: var(--ink-2); background: var(--surface-2); position: sticky; top: 0; cursor: pointer; user-select: none; }
th[aria-sort="ascending"]::after { content: " ↑"; } th[aria-sort="descending"]::after { content: " ↓"; }
td.n, th.n { text-align: right; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--surface-2); }
tbody tr.sel { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.ctrl { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.ctrl input[type=search] { padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); min-width: 0; flex: 1 1 200px; max-width: 320px; }
.pag { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--ink-2); }
.pag button { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.pag button:disabled { opacity: .4; cursor: default; }
.bar-cel { display: inline-block; width: 60px; height: 8px; border-radius: 2px; background: var(--grid); vertical-align: middle; margin-left: 6px; overflow: hidden; position: relative; }
.bar-cel i { position: absolute; inset: 0 auto 0 0; background: var(--c); }

.ficha { border: 1px solid var(--line); border-radius: 10px; padding: 16px; background: var(--bg); display: grid; gap: 12px; }

.cand-dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; background: var(--c); margin-right: 6px; vertical-align: 1px; }

.metodo { display: grid; gap: 10px; color: var(--ink-2); max-width: 82ch; }
.metodo p { margin: 0; }
.carregando { color: var(--muted); padding: 40px 0; text-align: center; }
.aviso { border-left: 3px solid var(--cury); padding: 8px 12px; background: var(--surface-2); border-radius: 0 6px 6px 0; font-size: 13.5px; color: var(--ink-2); }
footer { max-width: 1180px; margin: 0 auto; color: var(--muted); font-size: 13px; display: grid; gap: 4px; padding-top: 8px; }
.ap-palco { position: relative; }
.ap-hud, .vp-hud { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 13px; letter-spacing: 0.12em; color: var(--muted); padding: 0 4px 6px; }
.ap-hud b, .vp-hud b { color: var(--ink); font-weight: 500; }
.ap-ctrl { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }

.reg-lin { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 10px; align-items: center; font-size: 13px; color: var(--ink-2); margin-bottom: 6px; }
.reg-barra { display: flex; height: 16px; border-radius: 4px; overflow: hidden; background: var(--surface-2); }
.reg-barra i { display: block; height: 100%; }
.reg-barra i + i { box-shadow: inset 2px 0 0 var(--surface); }
.reg-leg { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink-2); margin-top: 4px; }
.reg-leg i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.ap-momentos { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 10px; }
.ap-momentos li { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px; font-size: 13px; color: var(--muted); transition: opacity .3s, border-color .3s; opacity: .45; }
.ap-momentos li b { color: var(--ink); font-family: var(--f-mono); font-weight: 500; font-size: 12.5px; }
.ap-momentos li.passou { opacity: 1; border-color: var(--accent); color: var(--ink-2); }
body.modo-video .topo, body.modo-video footer { display: none; }

.video-palco { width: 1080px; height: 1080px; background: var(--bg); padding: 56px 64px 44px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
.video-palco .olho { font-size: 22px; }
.vp-topo { display: flex; justify-content: space-between; }

.vp-legenda { min-height: 108px; display: grid; gap: 4px; align-content: start; margin-top: 8px; }
.vp-legenda b { font-family: var(--f-mono); font-weight: 500; font-size: 27px; color: var(--ink); }
.vp-legenda span { font-size: 24px; color: var(--ink-2); line-height: 1.3; }
.vp-rodape { margin-top: auto; display: flex; justify-content: space-between; font-size: 17px; color: var(--muted); }
.int-mini { display: inline-flex; align-items: flex-end; gap: 2px; height: 34px; width: 150px; vertical-align: middle; }

.quadro-conc { border-left: 3px solid var(--accent); background: var(--surface-2); border-radius: 0 8px 8px 0; padding: 12px 14px; font-size: 14.5px; color: var(--ink-2); line-height: 1.55; }

.bl-cab { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; align-items: center; margin: 6px 0 10px; }
@media (max-width: 560px) { #bl-log td:first-child, #bu-log td:first-child, #ficha-log td:first-child { white-space: normal; min-width: 120px; } #bl-log td, #bu-log td, #ficha-log td, #bl-log th, #bu-log th, #ficha-log th { padding-left: 6px; padding-right: 6px; } }
.bu-papel { border: 1px solid var(--line); border-radius: 10px; padding: 16px; background: var(--surface); display: grid; gap: 14px; margin-bottom: 14px; }
.bu-id { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 6px 0 2px; font-size: 14.5px; }

<script>
"use strict";
// ---------- formatação ----------
const NF = new Intl.NumberFormat("pt-BR");
const n0 = (v) => NF.format(Math.round(v));
const p1 = (v, d = 1) => (Number.isFinite(v) ? v : 0).toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d }) + "%";
const pp = (v, d = 1) => (v > 0 ? "+" : v < 0 ? "−" : "±") + Math.abs(v).toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d }) + " p.p.";
const sinal = (v) => (v > 0 ? "+" : v < 0 ? "−" : "") + n0(Math.abs(v));
const mi = (v) => Math.abs(v) >= 1e6 ? (v / 1e6).toLocaleString("pt-BR", { maximumFractionDigits: 2 }) + " mi"
  : Math.abs(v) >= 1e4 ? (v / 1e3).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " mil" : n0(v);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const z4 = (v) => String(v).padStart(4, "0");

// ---------- modelo de dados ----------
// t1: Lula, Flávio, Renan, Cury, Caiado, Zema, Outros, Branco, Nulo, Abst, Aptos
// t2: Lula, Flávio, Branco, Nulo, Abst, Aptos
const ORIG = ["Lula", "Flávio", "Renan", "Cury", "Caiado", "Zema", "Outros", "Branco", "Nulo", "Abst"];
const DEST = ["Lula", "Flávio", "Branco", "Nulo", "Abst"];
const ROT = { Lula: "Lula", "Flávio": "Flávio", Renan: "Renan Santos", Cury: "Augusto Cury", Caiado: "Ronaldo Caiado", Zema: "Zema",
  Outros: "Outros 6 candidatos", Branco: "Brancos", Nulo: "Nulos", Abst: "Abstenção" };
const COR = { Lula: "lula", "Flávio": "flavio", Renan: "renan", Cury: "cury", Caiado: "caiado", Zema: "zema", Outros: "outros", Branco: "branco", Nulo: "nulo", Abst: "abst" };
const COR_NUM = { 13: "Lula", 22: "Flávio", 14: "Renan", 70: "Cury", 55: "Caiado", 30: "Zema" };
const ELIM = ["Renan", "Cury", "Caiado", "Zema", "Outros"];

function agregado(t1, t2) {
  const val1 = t1.slice(0, 7).reduce((a, b) => a + b, 0), val2 = t2[0] + t2[1];
  const comp1 = t1[10] - t1[9], comp2 = t2[5] - t2[4];
  return {
    t1, t2, val1, val2, comp1, comp2, aptos1: t1[10], aptos2: t2[5],
    abst1: (100 * t1[9]) / t1[10], abst2: (100 * t2[4]) / t2[5],
    br1: (100 * t1[7]) / comp1, br2: (100 * t2[2]) / comp2, nu1: (100 * t1[8]) / comp1, nu2: (100 * t2[3]) / comp2,
    lula1: (100 * t1[0]) / val1, fla1: (100 * t1[1]) / val1, lula2: (100 * t2[0]) / val2, fla2: (100 * t2[1]) / val2,
    comparec1: (100 * comp1) / t1[10], comparec2: (100 * comp2) / t2[5],
  };
}
// fluxos em votos a partir de % por origem
function fluxoDe(pct, t1) { return pct.map((linha, k) => linha.map((p) => (p / 100) * t1[k])); }
function elimParaLula(F) {
  let l = 0, f = 0;
  ELIM.forEach((o) => { const k = ORIG.indexOf(o); l += F[k][0]; f += F[k][1]; });
  return l + f > 0 ? (100 * l) / (l + f) : NaN;
}

// ---------- tema ----------
let T = {};
function lerTema() {
  const cs = getComputedStyle(document.documentElement);
  const g = (v) => cs.getPropertyValue("--" + v).trim();
  T = { ink: g("ink"), ink2: g("ink-2"), muted: g("muted"), grid: g("grid"), axis: g("axis"), surface: g("surface"), bg: g("bg"),
    accent: g("accent"), up: g("up"), down: g("down"), mid: g("mid") };
  Object.values(COR).forEach((c) => (T[c] = g(c)));
}
const cor = (o) => T[COR[o]];

// ---------- gráficos ----------
const charts = [];
function novoGrafico(el, opt) {
  const c = echarts.init(el, null, { renderer: "canvas" });
  c.setOption(Object.assign({
    textStyle: { fontFamily: getComputedStyle(document.body).fontFamily, color: T.ink2 },
    animationDuration: 400,
    tooltip: { backgroundColor: T.surface, borderColor: T.axis, textStyle: { color: T.ink, fontSize: 13 }, extraCssText: "box-shadow:0 6px 20px rgba(0,0,0,.15);border-radius:8px;" },
  }, opt));
  charts.push(c);
  return c;
}
function limparGraficos() { while (charts.length) charts.pop().dispose(); }
window.addEventListener("resize", () => charts.forEach((c) => c.resize()));
const eixo = () => ({ axisLine: { lineStyle: { color: T.axis } }, axisTick: { show: false }, axisLabel: { color: T.ink2 }, splitLine: { lineStyle: { color: T.grid } } });

// ---------- dados ----------
const D = { resumo: null, uf: {}, secoes: {} };
// arquivo .json.gz descomprimido no navegador (os logs por seção são publicados comprimidos)
// (no artefato do Claude, que não serve .gz, o mesmo arquivo vai em base64 com sufixo .b64.txt)
async function jsonGz(url) {
  let r = await fetch(url), corpo;
  if (r.ok && !(r.headers.get("content-type") || "").includes("html")) corpo = r.body;
  else {
    r = await fetch(url + ".b64.txt"); if (!r.ok) throw new Error(url + ": " + r.status);
    const b = atob((await r.text()).trim()), u = new Uint8Array(b.length);
    for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
    corpo = new Blob([u]).stream();
  }
  return new Response(corpo.pipeThrough(new DecompressionStream("gzip"))).json();
}
async function json(url) { const r = await fetch(url); if (!r.ok) throw new Error(url + ": " + r.status); return r.json(); }
async function carregarUF(uf) { return (D.uf[uf] ||= await json(`dados/uf/${uf}.json`)); }
async function carregarSecoes(uf) { return (D.secoes[uf] ||= await json(`dados/secoes/${uf}.json`)); }

// ---------- componentes ----------
function htmlPlacar(a, rotulo) {
  const vence = a.lula2 >= a.fla2 ? "Lula" : "Flávio";
  return `<div class="placar">
    <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center">
      <span class="olho">2º turno · 25/10/2026 · ${esc(rotulo)}</span>
      <span class="selo" style="--c:var(--${COR[vence]})">${vence === "Lula" ? "Lula venceu" : "Flávio venceu"}</span>
    </div>
    <div class="placar-nomes">
      <div><strong style="color:var(--lula)">${p1(a.lula2, 2)}</strong><span>Lula (PT) · ${n0(a.t2[0])} votos</span></div>
      <div><strong style="color:var(--flavio)">${p1(a.fla2, 2)}</strong><span>Flávio Bolsonaro (PL) · ${n0(a.t2[1])} votos</span></div>
    </div>
    <div class="barra2" role="img" aria-label="Lula ${p1(a.lula2)} contra Flávio ${p1(a.fla2)}"><i style="width:${a.lula2}%;background:var(--lula)"></i><i style="flex:1;background:var(--flavio)"></i></div>
    <p class="nota">No 1º turno (04/10): Lula ${p1(a.lula1)} · Flávio ${p1(a.fla1)} dos votos válidos. Diferença no 2º turno: ${n0(Math.abs(a.t2[0] - a.t2[1]))} votos.</p>
  </div>`;
}
function kpi(rot, v1, v2, fmtv, invert, sub) {

// Sankey 1º → 2º turno
function grafSankey(el, F, soMudancas) {
  const total = F.flat().reduce((a, b) => a + b, 0);
  const links = [];
  F.forEach((linha, k) => linha.forEach((v, j) => {
    const fica = ORIG[k] === DEST[j];
    if (soMudancas && fica) return;
    if (v / total < 0.0004) return;
    links.push({ source: ROT[ORIG[k]] + " · 1º", target: ROT[DEST[j]] + " · 2º", value: Math.round(v) });
  }));
  const usados = new Set(links.flatMap((l) => [l.source, l.target]));
  const nodes = [...ORIG.map((o) => ({ name: ROT[o] + " · 1º", o })), ...DEST.map((o) => ({ name: ROT[o] + " · 2º", o }))]
    .filter((n) => usados.has(n.name)).map((n) => ({ name: n.name, itemStyle: { color: cor(n.o), borderColor: cor(n.o) } }));
  novoGrafico(el, {
    tooltip: { trigger: "item", formatter: (p) => p.dataType === "edge"
      ? `${esc(p.data.source.replace(" · 1º", ""))} (1º) → ${esc(p.data.target.replace(" · 2º", ""))} (2º)<br><b>${n0(p.value)}</b> eleitores (estimativa)`
      : `<b>${esc(p.name)}</b><br>${n0(p.value)} eleitores` },
    series: [{ type: "sankey", left: 8, right: 130, top: 10, bottom: 10, nodeWidth: 12, nodeGap: 10, draggable: false,
      emphasis: { focus: "adjacency" }, data: nodes, links,
      lineStyle: { color: "gradient", opacity: 0.38, curveness: 0.5 },
      label: { color: T.ink, fontSize: 12, formatter: (p) => `${p.name.replace(/ · [12]º/, "")}  ${mi(p.value)}` } }],
  });
}

// ---------- tabela ordenável ----------
function tabela(cont, { colunas, linhas, porPagina = 50, busca, aoClicar, idSel }) {
  let ordem = { i: colunas.findIndex((c) => c.ordemPadrao), dir: -1 }, pagina = 0, filtro = "";
  if (ordem.i < 0) ordem.i = 0;
  cont.innerHTML = `${busca ? `<div class="ctrl"><input type="search" id="${busca.id}" placeholder="${esc(busca.placeholder)}" aria-label="${esc(busca.placeholder)}"><span class="nota" data-cont></span></div>` : ""}
    <div class="tabela-wrap"><table><thead><tr>${colunas.map((c, i) => `<th class="${c.n ? "n" : ""}" data-i="${i}" scope="col" title="${esc(c.dica || "")}">${c.t}</th>`).join("")}</tr></thead><tbody></tbody></table></div>
    <div class="pag" data-pag></div>`;
  const tbody = cont.querySelector("tbody"), pag = cont.querySelector("[data-pag]"), contador = cont.querySelector("[data-cont]");
  function desenhar() {
    let ls = filtro ? linhas.filter((l) => busca.campo(l).toLowerCase().includes(filtro)) : linhas.slice();
    const c = colunas[ordem.i];
    ls.sort((a, b) => { const x = c.v(a), y = c.v(b); return (typeof x === "string" ? x.localeCompare(y, "pt-BR") : x - y) * ordem.dir; });
    const nPag = Math.max(1, Math.ceil(ls.length / porPagina)); pagina = Math.min(pagina, nPag - 1);
    tbody.innerHTML = ls.slice(pagina * porPagina, (pagina + 1) * porPagina).map((l) =>
      `<tr data-id="${esc(l.id)}" class="${idSel && idSel() === l.id ? "sel" : ""}" tabindex="0">${colunas.map((c) => `<td class="${c.n ? "n" : ""}">${c.f ? c.f(l) : esc(c.v(l))}</td>`).join("")}</tr>`).join("");
    cont.querySelectorAll("th").forEach((th, i) => th.setAttribute("aria-sort", i === ordem.i ? (ordem.dir > 0 ? "ascending" : "descending") : "none"));
    pag.innerHTML = nPag > 1 ? `<button data-p="-1" ${pagina === 0 ? "disabled" : ""}>Anterior</button><span>Página ${pagina + 1} de ${nPag} · ${n0(ls.length)} linhas</span><button data-p="1" ${pagina >= nPag - 1 ? "disabled" : ""}>Próxima</button>` : `<span>${n0(ls.length)} linhas</span>`;
    if (contador) contador.textContent = filtro ? `${n0(ls.length)} encontrados` : "";
  }
  cont.querySelector("thead").addEventListener("click", (e) => { const th = e.target.closest("th"); if (!th) return; const i = +th.dataset.i;
    ordem = { i, dir: ordem.i === i ? -ordem.dir : (colunas[i].n ? -1 : 1) }; desenhar(); });
  pag.addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; pagina += +b.dataset.p; desenhar(); });
  if (busca) cont.querySelector("input").addEventListener("input", (e) => { filtro = e.target.value.trim().toLowerCase(); pagina = 0; desenhar(); });
  const clicar = (e) => { const tr = e.target.closest("tbody tr"); if (tr && aoClicar) aoClicar(linhas.find((l) => String(l.id) === tr.dataset.id)); };
  tbody.addEventListener("click", clicar);
  tbody.addEventListener("keydown", (e) => { if (e.key === "Enter") clicar(e); });
  desenhar();
  return { redesenhar: desenhar };
}

const GRADE = { RR: [0, 2], AP: [0, 4], AM: [1, 1], PA: [1, 3], MA: [1, 4], CE: [1, 5], RN: [1, 6], AC: [2, 0], RO: [2, 1], MT: [2, 2], TO: [2, 3], PI: [2, 4], PE: [2, 5], PB: [2, 6],
  MS: [3, 1], GO: [3, 2], DF: [3, 3], BA: [3, 4], SE: [3, 5], AL: [3, 6], PR: [4, 1], SP: [4, 2], MG: [4, 3], ES: [4, 4], SC: [5, 1], RJ: [5, 3], RS: [6, 1], ZZ: [6, 5] };
function misturar(c1, c2, t) {
  const h = (c) => { c = c.replace("#", ""); return [0, 2, 4].map((i) => parseInt(c.slice(i, i + 2), 16)); };
  const a = h(c1), b = h(c2);
  return "#" + a.map((x, i) => Math.round(x + (b[i] - x) * t).toString(16).padStart(2, "0")).join("");
}
function tintaPara(hex) { const c = hex.replace("#", ""); const [r, g, b] = [0, 2, 4].map((i) => parseInt(c.slice(i, i + 2), 16) / 255);
  return 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.55 ? "#111512" : "#ffffff"; }
const METRICAS_MAPA = {

  abst: { rot: "Variação da abstenção", f: (a) => a.abst2 - a.abst1, div: ["down", "up"], lim: 8, txt: (v) => (v > 0 ? "+" : "") + v.toFixed(1),

function colunasResultado(titulo, nome, comElim) {
  const cols = [
    { t: titulo, v: nome },
    { t: "Aptos", n: 1, v: (l) => l.a.aptos2, f: (l) => n0(l.a.aptos2), ordemPadrao: 1 },
    { t: "Lula 1º", n: 1, v: (l) => l.a.lula1, f: (l) => p1(l.a.lula1) },
    { t: "Flávio 1º", n: 1, v: (l) => l.a.fla1, f: (l) => p1(l.a.fla1) },
    { t: "Lula 2º", n: 1, v: (l) => l.a.lula2, f: (l) => barCel(l.a.lula2, "lula") },
    { t: "Flávio 2º", n: 1, v: (l) => l.a.fla2, f: (l) => p1(l.a.fla2) },
    { t: "Abst. 1º", n: 1, v: (l) => l.a.abst1, f: (l) => p1(l.a.abst1) },
    { t: "Abst. 2º", n: 1, v: (l) => l.a.abst2, f: (l) => p1(l.a.abst2) },
    { t: "Δ comparec.", n: 1, dica: "Variação do comparecimento, em pontos percentuais dos aptos", v: (l) => l.a.comparec2 - l.a.comparec1,
      f: (l) => `<span class="${l.a.comparec2 >= l.a.comparec1 ? "delta-down" : "delta-up"}">${pp(l.a.comparec2 - l.a.comparec1)}</span>` },
    { t: "Br+Nu 1º", n: 1, v: (l) => l.a.br1 + l.a.nu1, f: (l) => p1(l.a.br1 + l.a.nu1) },
    { t: "Br+Nu 2º", n: 1, v: (l) => l.a.br2 + l.a.nu2, f: (l) => p1(l.a.br2 + l.a.nu2) },
  ];
  if (comElim) cols.push({ t: "Eliminados → Lula", n: 1, dica: "Dos votos dos candidatos eliminados que foram para um finalista, % estimado que foi para Lula",
    v: (l) => (Number.isFinite(l.elim) ? l.elim : -1), f: (l) => (Number.isFinite(l.elim) ? p1(l.elim) : "—") });
  return cols;
}

    fc.features = fc.features.filter((f) => !uf || f.properties.uf === uf)

}

// mapa dos locais de votação de um município
function mapaLocais(cont, uf, cod, locaisL, aoClicar) {
  const comCoord = locaisL.filter((l) => l.lat != null && l.lon != null);
  if (!comCoord.length || uf === "ZZ") { cont.innerHTML = `<p class="nota">Sem coordenadas dos locais de votação para este município.</p>`; return null; }
  cont.innerHTML = `<div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center"><h3>Mapa dos locais de votação</h3>
    <div class="seg" role="group" aria-label="Cor dos locais" id="seg-loc"><button aria-pressed="true" data-l="lula2">Lula no 2º turno</button><button aria-pressed="false" data-l="dlula">Variação de Lula</button><button aria-pressed="false" data-l="dcomp">Variação do comparecimento</button></div></div>
    <div class="grafico" data-g="mapa-loc" style="height:460px"><p class="carregando">Carregando mapa…</p></div>
    <p class="nota">${n0(comCoord.length)} de ${n0(locaisL.length)} locais com coordenadas no cadastro do TSE. O tamanho do círculo é o número de eleitores; clique num local para filtrar as seções.</p>`;
  const el = cont.querySelector('[data-g="mapa-loc"]');

  const valor = (l) => (modo === "lula2" ? l.a.lula2 : modo === "dlula" ? l.a.lula2 - (100 * l.a.t1[0]) / (l.a.t1[0] + l.a.t1[1]) : l.a.comparec2 - l.a.comparec1);
  carregarMapa().then(() => {
    const feat = topojson.feature(MAPA.topo, MAPA.topo.objects.municipios).features.find((f) => f.properties.uf === uf && f.properties.tse === cod);
    const nomeMapa = `loc-${uf}-${cod}`;
    if (feat) echarts.registerMap(nomeMapa, { type: "FeatureCollection", features: [{ ...feat, properties: { name: "m" } }] });
    const lons = comCoord.map((l) => l.lon), lats = comCoord.map((l) => l.lat);
    const desenhar = () => { el.innerHTML = ""; chart = trocarGrafico(el, () => {
      const vm = modo === "lula2" ? { min: 20, max: 80, inRange: { color: [T.flavio, T.mid, T.lula] }, text: ["80% Lula", "20%"] }
        : modo === "dlula" ? { min: -6, max: 6, inRange: { color: [T.flavio, T.mid, T.lula] }, text: ["+6 p.p.", "−6 p.p."] }
        : { min: -6, max: 6, inRange: { color: [T.down, T.mid, T.up] }, text: ["+6 p.p.", "−6 p.p."] };
      const maxApt = Math.max(...comCoord.map((l) => l.a.aptos2));

        visualMap: { ...vm, calculable: false, orient: "horizontal", left: 8, bottom: 4, itemWidth: 12, itemHeight: 140, textStyle: { color: T.ink2 }, seriesIndex: 0, dimension: 2 },
        geo: feat ? { map: nomeMapa, roam: true, scaleLimit: { min: 0.8, max: 60 }, layoutCenter: ["50%", "50%"], layoutSize: "95%", itemStyle: { areaColor: T.bg, borderColor: T.axis, borderWidth: 1 },
          emphasis: { disabled: true }, select: { disabled: true }, silent: true,
          ...(Math.max(...lons) - Math.min(...lons) < 0.6 ? { boundingCoords: [[Math.min(...lons) - 0.02, Math.max(...lats) + 0.02], [Math.max(...lons) + 0.02, Math.min(...lats) - 0.02]] } : {}) }
          : undefined,
        series: [{ type: "scatter", coordinateSystem: "geo", data: comCoord.map((l) => ({ value: [l.lon, l.lat, +valor(l).toFixed(2)], l })),
          symbolSize: (v, p) => 5 + 18 * Math.sqrt(p.data.l.a.aptos2 / maxApt), itemStyle: { borderColor: T.surface, borderWidth: 1, opacity: 0.9 },

  D.logpartes ||= await json("dados/logs_secoes/partes.json").catch(() => ({}));

}

      <label>Zona<input id="${p}-zona" type="number" min="1" inputmode="numeric" required placeholder="ex.: 1"></label>

// aoEscolher(res, {uf, cod, zona, secao, linha, S}) desenha o resultado da seção escolhida
function ligarBuscaSecao(app, p, rota, aoEscolher) {
  const f = app.querySelector(`#${p}-form`); if (!f) return;
  const selUF = f.querySelector(`#${p}-uf`), inMun = f.querySelector(`#${p}-mun`), dl = f.querySelector(`#${p}-muns`), res = app.querySelector(`#${p}-res`);
  const munsUF = (uf) => D.resumo.indice_municipios.filter((x) => x[0] === uf);
  selUF.onchange = () => { inMun.value = ""; dl.innerHTML = munsUF(selUF.value).map((x) => `<option value="${esc(x[2])}">`).join(""); };
  const norm = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
  const marcarURL = (uf, zona, secao) => { try { history.replaceState(null, "", `#${rota}?uf=${uf}&zona=${zona}${secao ? "&secao=" + secao : ""}`); } catch (_) {} };
  async function mostrar(uf, zona, secao, munNome) {
    res.innerHTML = `<p class="nota">Procurando…</p>`;
    const S = await carregarSecoes(uf);
    let codMun = null;
    if (munNome) { const m = munsUF(uf).find((x) => norm(x[2]) === norm(munNome)); if (!m) { res.innerHTML = `<p class="aviso">Município “${esc(munNome)}” não encontrado em ${esc(D.resumo.ufs[uf].nome)}.</p>`; return; } codMun = m[1]; }
    const linhas = S.linhas.filter((l) => l[1] === zona && (codMun == null || l[0] === codMun));
    if (!linhas.length) { res.innerHTML = `<p class="aviso">Nenhuma seção na zona ${z4(zona)}${codMun ? " de " + esc(nomeMunicipio(uf, codMun)) : ""} (${uf}).</p>`; return; }
    if (!secao) {
      res.innerHTML = `<p class="nota">${n0(linhas.length)} seções na zona ${z4(zona)} (${uf}). Escolha uma:</p><div class="bl-chips">${linhas.sort((a, b) => a[2] - b[2]).map((l) => `<button type="button" data-s="${l[2]}" title="${esc(nomeMunicipio(uf, l[0]))}">${z4(l[2])}</button>`).join("")}</div>`;
      res.querySelectorAll(".bl-chips button").forEach((b) => (b.onclick = () => { f.querySelector(`#${p}-secao`).value = +b.dataset.s; marcarURL(uf, zona, +b.dataset.s); mostrar(uf, zona, +b.dataset.s, munNome); }));
      return;
    }
    const l = linhas.find((x) => x[2] === secao);
    if (!l) { res.innerHTML = `<p class="aviso">Seção ${z4(secao)} não encontrada na zona ${z4(zona)} (${uf}).</p>`; return; }
    aoEscolher(res, { uf, cod: l[0], zona, secao, linha: l, S });
  }
  f.onsubmit = (e) => {
    e.preventDefault();
    const uf = selUF.value, zona = +f.querySelector(`#${p}-zona`).value, secao = +f.querySelector(`#${p}-secao`).value || null;
    if (!uf || !zona) return;
    marcarURL(uf, zona, secao);
    mostrar(uf, zona, secao, inMun.value.trim());
  };
  const q = new URLSearchParams(location.hash.split("?")[1] || "");
  if (q.get("uf") && q.get("zona") && D.resumo.ufs[q.get("uf")]) {
    selUF.value = q.get("uf"); selUF.onchange(); f.querySelector(`#${p}-zona`).value = q.get("zona"); if (q.get("secao")) f.querySelector(`#${p}-secao`).value = q.get("secao");
    mostrar(q.get("uf"), +q.get("zona"), +q.get("secao") || null, "");
  }
}
const nomeMunicipio = (uf, cod) => D.resumo.indice_municipios.find((x) => x[0] === uf && x[1] === cod)?.[2] || String(cod);
function cabecalhoSecao({ uf, cod, zona, secao, linha, S }, extra = "") {

function htmlMetodoLogs() {
  return `<section class="bloco"><div class="bloco-cab"><div><span class="olho">Como foi calculado</span><h2>Fonte e método dos logs</h2></div></div><div class="metodo">
    <p><b>Fonte.</b> Pacotes "Arquivos transmitidos para totalização" do Portal de Dados Abertos do TSE, um por estado e turno, com o boletim, o log, o registro digital do voto e as assinaturas de cada seção (cerca de 220 GB). Os pacotes foram lidos diretamente do servidor do TSE e só os logs foram abertos.</p>
    <p><b>Recorte.</b> De cada log, só os eventos do dia da eleição do turno (04/10 ou 25/10). Horários convertidos para o de Brasília quando comparados com 8h e 17h; no exterior, não há comparação de horário.</p>
    <p><b>Definições.</b> Troca de urna: mensagens de contingência no log. Pronta no horário: "Urna pronta para receber votos" até 5 minutos depois das 8h. Erro fora da rotina: mensagens de nível ERRO, exceto "Problema ao desmontar a MR", registrada em quase toda urna ao retirar a mídia de resultado. Reinício: urna religada entre a abertura e o encerramento. Habilitação manual: votos no log menos habilitações por biometria.</p>
    <p><b>Limites.</b> O log descreve o funcionamento da urna; ele não registra em quem cada eleitor votou. Ocorrências como troca de urna ou erro de leitura biométrica fazem parte da operação normal e têm procedimentos próprios; o que a análise verifica é se elas se concentram em algum lugar ou se associam a mudança de voto. Código: scripts 16_logs_urnas.py e 17_analise_logs.py.</p>
  </div></section>`;
}

// ---------- metodologia ----------
function htmlMetodo() {
  const R = D.resumo;
  return `<section class="bloco" id="metodo"><div class="bloco-cab"><div><span class="olho">Como foi calculado</span><h2>Metodologia e fontes</h2></div></div>
  <div class="metodo">
    <p><b>Resultados.</b> Todos os votos, brancos, nulos, abstenções e aptos são os números oficiais do TSE (Portal de Dados Abertos, arquivos <span class="mono">votacao_secao</span>, <span class="mono">detalhe_votacao_secao</span> e <span class="mono">votacao_candidato_munzona</span> de 2026). A soma das ${n0(R.secoes)} seções confere exatamente com os totais oficiais. Nulos incluem os nulos técnicos.</p>
    <p><b>Migração de votos é uma estimativa.</b> O voto é secreto, então não existe registro de como cada eleitor votou nos dois turnos. A migração é estimada por inferência ecológica: em cada seção, a composição do 2º turno é modelada como uma combinação da composição do 1º. A matriz de transição (que fração de cada escolha do 1º turno foi para cada opção do 2º) é obtida por mínimos quadrados ponderados pelo eleitorado da seção, com cada linha somando 100% e sem valores negativos.</p>
    <p><b>Brasil, estados e municípios.</b> Cada estado tem sua própria matriz, estimada com as suas seções. O Brasil e as regiões somam os fluxos de cada estado. Nos municípios, a estimativa é combinada com a do estado: quanto menos seções o município tem, mais ela se aproxima do padrão estadual.</p>
    <p><b>Incerteza.</b> Os intervalos de 90% vêm de um bootstrap das seções e medem só a variação amostral, por isso são estreitos. A principal fonte de incerteza é a premissa de que eleitores com a mesma escolha no 1º turno se comportam de modo parecido dentro do estado. Para dar uma ideia dela, a tabela da matriz mostra também a estimativa feita com zonas eleitorais em vez de seções: onde as duas divergem (por exemplo, nos eleitores de Renan Santos), leia a estimativa como uma faixa. Fluxos dos finalistas, de brancos, nulos e abstenção e o total dos eliminados são os mais estáveis.</p>
    <p><b>Código e dados.</b> <a href="https://github.com/adriano-atanes/analise-eleicao-presidente-2026" target="_blank" rel="noopener">github.com/adriano-atanes/analise-eleicao-presidente-2026</a>. Dados gerados em ${esc(R.gerado_em)}.</p>
  </div></section>`;
}

// centro = média esperada do modelo; conta resultados tão ou mais extremos, o valor exato de Lula e um histograma fixo.
async function audSimularFluxo(c, P, alpha, S, seed, obs, Lobs, faixa, aoProgresso, cancelado, adaptativo) {

      const b = Math.floor((s - lo) / passo); if (b >= 0 && b < bins) h[b]++;

      p_hi: ext === 0 ? 1 - Math.pow(0.025, 1 / n) : Math.min(1, (ext + 2 * Math.sqrt(ext) + 2) / n), p_lo: ext === 0 ? 0 : Math.max(0, (ext - 2 * Math.sqrt(ext)) / n), media: m, dp: sd, z },

}

}
function audProb(sim, obs) {

  let k = 0; const d = Math.abs(obs - m) - 1e-15; for (const v of sim) if (Math.abs(v - m) >= d) k++;
  const z = sd > 0 ? (obs - m) / sd : 0, pN = 2 * normSf(Math.abs(z));

  return { p: k >= 1 ? k / S : pN, extremos: k, simulacoes: S, metodo: k >= 10 ? "monte_carlo" : k > 0 ? "monte_carlo_impreciso" : "extrapolacao_normal",
    p_hi: k === 0 ? hi : Math.min(1, (k + 2 * Math.sqrt(k) + 2) / S), p_lo: k === 0 ? 0 : Math.max(0, (k - 2 * Math.sqrt(k)) / S), media: m, dp: sd, z };

function normSf(x) { const t = 1 / (1 + 0.2316419 * x), d = 0.3989423 * Math.exp(-x * x / 2); const p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274)))); return x > 8 ? Math.exp(-x * x / 2) / (x * Math.sqrt(2 * Math.PI)) : p; }

// referência contrafactual: linha "demais" refeita com o comportamento histórico dos eleitores dos eliminados
// (direita: Renan, Caiado, Zema; centro: Cury; outros: metade esquerda, metade direita), mantendo o resto da matriz do nível acima.
function audRefHistorica(Pref, t1, ano) {
  const g = D.ideo.anos[String(ano)].grupos, dir = g.direita.pt_entre_finalistas / 100, cen = (g.centro.pt_entre_finalistas ?? g.direita.pt_entre_finalistas) / 100, esq = (g.esquerda.pt_entre_finalistas ?? 60) / 100;
  const w = { dir: t1[2] + t1[4] + t1[5] + t1[6] / 2, cen: t1[3], esq: t1[6] / 2 }, tot = w.dir + w.cen + w.esq;
  const parte = tot ? (w.dir * dir + w.cen * cen + w.esq * esq) / tot : dir;
  const P = Pref.map((r) => r.slice()), fin = P[2][0] + P[2][1];
  P[2][0] = fin * parte; P[2][1] = fin * (1 - parte);
  return { P, parte, dir, cen };
}
// ---- contexto do recorte ativo
async function audContexto(st) {
  const R = D.resumo, N = AUD.nac;
  const ctx = { st, nivel: "brasil", rotulo: "Brasil", partes: [["Brasil", { reg: null, uf: null, mun: null, zona: null, secao: null }]] };
  if (st.uf && R.ufs[st.uf]) {
    const [U, A] = await Promise.all([carregarUF(st.uf), (AUD.uf[st.uf] ||= await json(`dados/auditoria/uf/${st.uf}.json`))]);
    ctx.U = U; ctx.A = A; ctx.reg = R.ufs[st.uf].regiao;
    ctx.partes.push([R.ufs[st.uf].regiao, { reg: R.ufs[st.uf].regiao, uf: null, mun: null, zona: null, secao: null }], [R.ufs[st.uf].nome, { uf: st.uf, mun: null, zona: null, secao: null }]);
    const mU = st.mun && U.municipios.find((m) => m.cod === st.mun), aM = st.mun && A.municipios.find((m) => m.id === st.mun);
    if (mU && aM) {
      ctx.partes.push([mU.nome, { mun: st.mun, zona: null, secao: null }]);
      if (st.zona) {
        const aZ = A.zonas.find((z) => z.id === `${st.mun}-${st.zona}`);
        if (aZ) {
          ctx.partes.push([`Zona ${z4(st.zona)}`, { zona: st.zona, secao: null }]);
          if (st.secao) {
            const S = await carregarSecoes(st.uf);
            const l = S.linhas.find((x) => x[0] === st.mun && x[1] === st.zona && x[2] === st.secao);
            if (l) {
              ctx.partes.push([`Seção ${z4(st.secao)}`, { secao: st.secao }]);
              return Object.assign(ctx, { nivel: "secao", rotulo: `Seção ${z4(st.secao)} · zona ${z4(st.zona)} · ${mU.nome} (${st.uf})`, t1: l.slice(4, 15), t2: l.slice(15, 21),
                pct: mU.mig.pct, pctRef: mU.mig.pct, alpha: N.alpha.por_uf[st.uf]?.secao, aud: null, refTxt: `matriz municipal (${mU.nome})` });
            }
          }
          return Object.assign(ctx, { nivel: "zona", rotulo: `Zona ${z4(st.zona)} · ${mU.nome} (${st.uf})`, t1: aZ.contagens.turno1, t2: aZ.contagens.turno2, pct: mU.mig.pct, pctRef: mU.mig.pct,
            alpha: aZ.monte_carlo.alpha, aud: aZ, refTxt: `matriz municipal (${mU.nome})` });
        }
      }
      return Object.assign(ctx, { nivel: "municipio", rotulo: `${mU.nome} (${st.uf})`, t1: aM.contagens.turno1, t2: aM.contagens.turno2, pct: mU.mig.pct,
        pctRef: R.ufs[st.uf].migracao.pct, alpha: aM.monte_carlo.alpha, aud: aM, refTxt: `matriz estadual (${R.ufs[st.uf].nome})` });
    }
    const aU = N.ufs[st.uf];
    return Object.assign(ctx, { nivel: "uf", rotulo: R.ufs[st.uf].nome, t1: aU.contagens.turno1, t2: aU.contagens.turno2, pct: R.ufs[st.uf].migracao.pct,
      pctRef: R.migracao.brasil.pct, alpha: aU.monte_carlo.alpha, aud: aU, refTxt: "matriz nacional" });
  }
  if (st.reg && N.regioes[st.reg]) {
    const aR = N.regioes[st.reg];
    ctx.partes.push([st.reg, { reg: st.reg }]);
    return Object.assign(ctx, { nivel: "regiao", rotulo: st.reg, t1: aR.contagens.turno1, t2: aR.contagens.turno2, pct: R.migracao.regioes[st.reg].pct,
      pctRef: R.migracao.brasil.pct, alpha: aR.monte_carlo.alpha, aud: aR, refTxt: "matriz nacional" });
  }
  return Object.assign(ctx, { t1: N.brasil.contagens.turno1, t2: N.brasil.contagens.turno2, pct: R.migracao.brasil.pct, pctRef: null, alpha: null, aud: N.brasil, refTxt: null });
}

function audMetodo() {

    <ul class="passos">

      <li><b>Referência:</b> a unidade é comparada com a matriz de transferência do nível acima (região e UF → Brasil; município → UF; zona e seção → município), estimada por inferência ecológica com encolhimento hierárquico.</li>
      <li><b>Modelos:</b> multinomial; Dirichlet-Multinomial (principal), com concentração α calibrada para que os desvios das unidades irmãs tenham variância 1; hierárquico (α sorteado da distribuição bootstrap da calibração); bootstrap empírico entre unidades irmãs.</li>
      <li><b>Simulações:</b> ${n0(m.simulacoes.uf_regiao_municipio)} por região, UF e município; ${n0(m.simulacoes.zona)} por zona; ${n0(m.simulacoes.profundo)} no passe profundo (Silva Jardim e os 20 municípios mais distantes do esperado); semente ${m.seed}. Quando nenhuma simulação é tão extrema, a probabilidade é extrapolada pela aproximação normal e marcada com *; o limite superior de 95% é mostrado.</li>
      <li><b>Classificação:</b> FDR de Benjamini–Hochberg entre municípios: muito incomum q &lt; 0,01; incomum q &lt; 0,10; inconclusivo com menos de 300 votos nos finalistas ou sem votação registrada. Classificações não são afirmações de irregularidade.</li>
      <li><b>Mega-Sena:</b> 1 em 50.063.860 (aposta simples); comparação mostrada só quando o evento ocorreu ao menos 10 vezes nas simulações.</li>
      <li><b>Processamento:</b> ${esc(m.processado_em)} · ${fmtN(m.tempo_total_s, 0)} s · motor ${esc(m.versao_motor)} · esquema ${esc(m.schema_version)}. Código: scripts/auditoria_motor.py e scripts/22_auditoria.py; metodologia completa em docs/auditoria_metodologia.md.</li>

function indicePorTempo(ps, u) {
  const alvo = 100 * Math.pow(Math.max(0, Math.min(1, u)), 1.7);
  let lo = 0, hi = ps.length - 1;
  if (alvo >= ps[hi]) return hi;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (ps[m] <= alvo) lo = m; else hi = m; }
  return lo + (alvo - ps[lo]) / Math.max(1e-9, ps[hi] - ps[lo]);
}

    </div>
    <section class="bloco"><div class="bloco-cab"><div><span class="olho" id="ap-olho"></span><h2 id="ap-tit"></h2></div>
      <div class="seg" role="group" aria-label="Turno" id="seg-ap"><button aria-pressed="true" data-t="1">1º turno</button><button aria-pressed="false" data-t="2">2º turno</button></div></div>
      <div class="ap-palco">
        <div class="ap-hud"><span>HORA <b id="hud-hora">--</b></span><span><b id="hud-pct">0%</b> DAS SEÇÕES</span></div>
        <div class="grafico" data-g="apur" style="height:440px"></div>
      </div>
      <div class="ap-ctrl">
        <button class="ap-play" id="ap-play" aria-label="Reproduzir">▶ Reproduzir</button>
        <input type="range" id="ap-scrub" min="0" max="1000" value="0" aria-label="Momento da apuração">
        <div class="seg" role="group" aria-label="Velocidade" id="seg-vel"><button aria-pressed="false" data-v="0.5">0,5×</button><button aria-pressed="true" data-v="1">1×</button><button aria-pressed="false" data-v="2">2×</button></div>
        <label class="nota ap-chk"><input type="checkbox" id="ap-sort"> Comparar com ordem sorteada</label>
      </div>
      <ol class="ap-momentos" id="ap-mom"></ol>
      <div class="grade2 ap-sub">
        <div><h3 class="ap-h3">De onde vinham os votos já apurados</h3><div id="ap-reg"></div><div class="reg-leg">${legendaReg}</div></div>
        <div class="ap-porque"><h3 class="ap-h3">Por que a parcial muda</h3><p id="ap-expl"></p></div>
      </div>
      <p class="nota">Hora de cada seção: primeira totalização do boletim (DT_PRIM_TOT_PARCIAL_HOR_TSE, horário de Brasília). Percentuais sobre os votos válidos: todos os candidatos no 1º turno; Lula e Flávio no 2º. A linha tracejada soma as mesmas seções em ordem aleatória. Vídeos para compartilhar: <a href="https://adriano-atanes.github.io/analise-eleicao-presidente-2026/apuracao_1turno.mp4" target="_blank" rel="noopener">1º turno</a> · <a href="https://adriano-atanes.github.io/analise-eleicao-presidente-2026/apuracao_2turno.mp4" target="_blank" rel="noopener">2º turno</a> (MP4).</p>
    </section>
    ${htmlVerificacoes()}`;
  }
  let P, M;
  const hud = (q) => {
    app.querySelector("#hud-hora").textContent = hhmm(q.hora);
    app.querySelector("#hud-pct").textContent = p1(q.pct, 1);
    app.querySelector("#ap-reg").innerHTML = barraRegioes(q.regioes, AP[t].regioes_no_total, ordem);
    const mom = app.querySelector("#ap-mom");
    if (mom) mom.querySelectorAll("li").forEach((li) => li.classList.toggle("passou", +li.dataset.i <= q.i));
    const vl = app.querySelector("#vp-leg");
    if (vl) { const atual = [...M].reverse().find((m) => m.i <= q.i + 0.01); vl.innerHTML = atual ? `<b>${esc(atual.titulo)}</b><span>${esc(atual.texto)}</span>` : ""; }
  };
  const desenhar = () => { const f = indicePorTempo(AP[t].real.pct_secoes, u); hud(P.quadro(f)); const sc = app.querySelector("#ap-scrub"); if (sc) sc.value = Math.round(u * 1000); };
  const montar = () => {
    const A = AP[t];
    M = momentosApuracao(A, t);
    M.forEach((m) => { if (/para Flávio|abaixo de 50%|passa à frente/.test(m.titulo)) { m.marca = m.titulo.split(" · ")[1].replace(" para Flávio", "") + " · " + hhmm(A.real.hora[m.i]); m.serie = /Lula passa/.test(m.titulo) ? "lula" : "flavio"; } });
    M.forEach((m) => { if (/passa à frente/.test(m.titulo)) { m.marca = m.titulo.split(" · ")[1].replace(" passa à frente", " à frente") + "\n" + hhmm(A.real.hora[m.i]); m.embaixo = true; } });
    const el = app.querySelector('[data-g="apur"]');
    P = trocarGrafico(el, () => palcoApuracao(el, A, t, { sorteio, momentos: M, video: !!video }));
    if (!video) {
      app.querySelector("#ap-olho").textContent = `${t}º turno · ${t === "1" ? "04/10/2026" : "25/10/2026"} · votos válidos`;
      app.querySelector("#ap-tit").textContent = "A parcial, seção a seção";
      app.querySelector("#ap-mom").innerHTML = M.map((m) => `<li data-i="${m.i}"><b>${esc(m.titulo)}</b><span>${esc(m.texto)}</span></li>`).join("");
      const r = A.real.regioes, k = A.real.pct_secoes.findIndex((v) => v >= 25);
      app.querySelector("#ap-expl").innerHTML = `${t === "2" ? "Os primeiros boletins foram os do exterior; o grosso chegou depois das 19h. " : ""}Com ${p1(A.real.pct_secoes[k], 0)} das seções apuradas, o Nordeste era <b>${p1(r.Nordeste[k], 0)}</b> dos votos contados (${p1(A.regioes_no_total.Nordeste, 0)} no final) e o Sul, <b>${p1(r.Sul[k], 0)}</b> (${p1(A.regioes_no_total.Sul, 0)} no final). Quem chegou antes votava diferente da média. Somando as mesmas seções em ordem sorteada, a parcial fica perto do resultado desde o início: com 1.000 seções, o erro é de ±${A.erro_1000_secoes_pp.toLocaleString("pt-BR")} ponto.`;
    }
    desenhar();
  };
  if (video) {
    montar();
    window.__apuracao = { quadro: (uu) => { u = uu; desenhar(); }, pronto: true };
    return;
  }
  const btn = app.querySelector("#ap-play");
  const setTocando = (v) => { tocando = v; btn.textContent = v ? "❚❚ Pausar" : u >= 1 ? "↺ Repetir" : "▶ Reproduzir"; btn.setAttribute("aria-label", v ? "Pausar" : "Reproduzir"); if (v) { ultimo = performance.now(); raf = requestAnimationFrame(passo); } else cancelAnimationFrame(raf); };
  function passo(agora) {
    if (!tocando || !document.body.contains(btn)) return;
    u = Math.min(1, u + ((agora - ultimo) / DUR) * vel); ultimo = agora; desenhar();
    if (u >= 1) setTocando(false); else raf = requestAnimationFrame(passo);
  }
  btn.onclick = () => { if (u >= 1) u = 0; setTocando(!tocando); };
  app.querySelector("#ap-scrub").oninput = (e) => { setTocando(false); u = e.target.value / 1000; desenhar(); };
  app.querySelector("#ap-sort").onchange = (e) => { sorteio = e.target.checked; P.sorteio(sorteio); desenhar(); };
  app.querySelectorAll("#seg-vel button").forEach((b) => (b.onclick = () => { vel = +b.dataset.v; app.querySelectorAll("#seg-vel button").forEach((x) => x.setAttribute("aria-pressed", x === b)); }));
  app.querySelectorAll("#seg-ap button").forEach((b) => (b.onclick = () => { setTocando(false); t = b.dataset.t; u = 0; app.querySelectorAll("#seg-ap button").forEach((x) => x.setAttribute("aria-pressed", x === b)); montar(); }));
  montar();
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) setTocando(true); else { u = 1; desenhar(); setTocando(false); }
  desenharVerificacoes(app);
}

// ---------- roteamento ----------
function trilha(partes) {
  document.getElementById("trilha").innerHTML = partes.map(([t, h], i) => (i === partes.length - 1 ? `<b>${esc(t)}</b>` : `<a href="#${h}">${esc(t)}</a><span aria-hidden="true">›</span>`)).join("");
}
async function rotear() {
  limparGraficos(); lerTema(); document.documentElement.style.setProperty("--sum-h", "0px");
  const cmd = document.getElementById("cmd"); if (cmd.open) cmd.close();
  const app = document.getElementById("app"); const h = location.hash.slice(1);
  try {
    let m;
    if ((m = h.match(/^uf-([A-Z]{2})$/))) { trilha([["Brasil", ""], [D.resumo.ufs[m[1]]?.nome || m[1], h]]); await visaoUF(app, m[1]); }
    else if ((m = h.match(/^mun-([A-Z]{2})-(\d+)$/))) {
      const nome = D.resumo.indice_municipios.find((x) => x[0] === m[1] && x[1] === +m[2])?.[2] || m[2];
      trilha([["Brasil", ""], [D.resumo.ufs[m[1]]?.nome || m[1], "uf-" + m[1]], [nome, h]]); await visaoMunicipio(app, m[1], +m[2]);
    } else if (h === "auditoria" || h.startsWith("auditoria?")) { trilha([["Brasil", ""], ["Auditoria", "auditoria"]]); await visaoAuditoria(app); }
    else if (h === "perfil") { trilha([["Brasil", ""], ["Perfil", h]]); await visaoPerfil(app); }
    else if ((m = h.match(/^apuracao(?:-video-([12])(-sorteio)?)?$/))) { trilha([["Brasil", ""], ["Apuração", "apuracao"]]); await visaoApuracao(app, m[1] ? { turno: m[1], sorteio: !!m[2] } : null); }
    else if (h === "bu" || h.startsWith("bu?")) { trilha([["Brasil", ""], ["Seções", "bu"]]); await visaoBoletim(app); }
    else if (h.startsWith("logs?")) { location.replace("#bu?" + h.slice(5)); return; }
    else if (h === "logs") { trilha([["Brasil", ""], ["Urnas", h]]); await visaoLogs(app); }
    else { trilha([["Brasil", ""]]); visaoBrasil(app); }
    marcarMenu(h);
    if (["logs", "perfil"].includes(h)) montarSumario(app);
  } catch (e) { console.error(e); app.innerHTML = `<p class="aviso">Não foi possível carregar os dados (${esc(e.message)}). Recarregue a página.</p>`; }
  if (!(h.startsWith("auditoria") && rotaAnterior.startsWith("auditoria"))) window.scrollTo(0, 0);
  rotaAnterior = h;
}
let rotaAnterior = "";
window.addEventListener("hashchange", rotear);

// re-renderiza quando o tema muda
const mq = matchMedia("(prefers-color-scheme: dark)");
mq.addEventListener("change", rotear);
new MutationObserver(rotear).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

// ---------- busca de municípios ----------
// ---------- navegação: menu, busca universal (Ctrl+K) e sumário das páginas longas ----------
const PAGINAS = [
  { r: "", nome: "Resultado", desc: "Votos dos dois turnos, migração de votos e mapa por município", chaves: "resultado inicio brasil votos migracao mapa estados" },
  { r: "apuracao", nome: "Apuração", desc: "A parcial minuto a minuto e as verificações de alegações", chaves: "apuracao parcial virada contagem animacao verificacao falhas" },
  { r: "perfil", nome: "Perfil", desc: "Quem votou, quem faltou e onde Lula cresceu", chaves: "perfil idade escolaridade abstencao 2022" },
  { r: "auditoria", nome: "Auditoria", desc: "Testes estatísticos e comparação com 2002 a 2022", chaves: "auditoria testes historico benford digito comportamento" },
  { r: "logs", nome: "Urnas", desc: "O que os logs de todas as urnas registraram no dia", chaves: "urnas logs biometria contingencia troca erro intervalo modelo 17h" },
  { r: "bu", nome: "Seções", desc: "Boletim de urna e log de qualquer seção", chaves: "secao secoes boletim urna bu zona log" },
];
const ICONES = {
  "": '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  apuracao: '<path d="M4 19V5M4 19h16M8 15l3-4 3 2 5-6"/>',
  perfil: '<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 11a3 3 0 1 0 0-6M21 20c0-2.6-1.6-4.8-4-5.6"/>',
  auditoria: '<path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',
  logs: '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/>',
  bu: '<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/>',
  local: '<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
};
const icone = (r) => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONES[r]}</svg>`;
(function montarMenu() {
  document.getElementById("menu").innerHTML = PAGINAS.map((p) => `<a href="#${p.r}" data-r="${p.r}">${p.nome}</a>`).join("");
  document.getElementById("tabbar").innerHTML = PAGINAS.map((p) => `<a href="#${p.r}" data-r="${p.r}">${icone(p.r)}<span>${p.nome}</span></a>`).join("");
})();
function marcarMenu(h) {
  const raiz = h.split("?")[0];
  const r = /^(uf-|mun-)/.test(raiz) || raiz === "" ? "" : raiz.startsWith("apuracao") ? "apuracao" : raiz;
  document.querySelectorAll("[data-r]").forEach((a) => (a.dataset.r === r ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current")));
}
// sumário com destaque da seção visível (páginas longas)
function montarSumario(app) {
  const secs = [...app.querySelectorAll(":scope > section.bloco")].filter((s) => s.querySelector("h2"));
  if (secs.length < 4) return;
  const curto = (t) => t.replace(/\s+/g, " ").trim().replace(/^(O que|Como|Quem|Onde|Quando|Quanto) /, (m) => m).slice(0, 48);
  secs.forEach((s, i) => { if (!s.id) s.id = "sec-" + i; });
  const nav = document.createElement("nav");
  nav.className = "sumario"; nav.setAttribute("aria-label", "Nesta página");
  nav.innerHTML = `<span class="olho">Nesta página</span>` + secs.map((s) => `<a href="#" data-alvo="${s.id}">${esc(curto(s.querySelector("h2").textContent))}</a>`).join("");
  const cab = app.querySelector(".cabeca");
  (cab || app.firstChild).after(nav);
  nav.addEventListener("click", (e) => { const a = e.target.closest("a"); if (!a) return; e.preventDefault(); document.getElementById(a.dataset.alvo).scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }); });
  const io = new IntersectionObserver((ents) => {
    ents.forEach((en) => {
      if (!en.isIntersecting) return;
      nav.querySelectorAll("a").forEach((a) => a.classList.toggle("ativo", a.dataset.alvo === en.target.id));
      const at = nav.querySelector("a.ativo"); if (at) nav.scrollTo({ left: at.offsetLeft - 120, behavior: "smooth" });
    });
  }, { rootMargin: "-30% 0px -60% 0px" });
  secs.forEach((s) => io.observe(s));
  document.documentElement.style.setProperty("--sum-h", nav.offsetHeight + "px");
}
// busca universal: municípios, estados, seções ("BA 40 554") e páginas
(function buscaUniversal() {
  const dlg = document.getElementById("cmd"), inp = document.getElementById("cmd-inp"), lista = document.getElementById("cmd-lista");
  const norm = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
  let itens = [], ativo = 0;
  const abrir = () => { if (!D.resumo) return; if (typeof dlg.showModal === "function") dlg.showModal(); else dlg.setAttribute("open", ""); inp.value = ""; buscar(); setTimeout(() => inp.focus(), 0); };
  const fechar = () => { if (dlg.open) { if (dlg.close) dlg.close(); else dlg.removeAttribute("open"); } };
  function buscar() {
    const q = norm(inp.value), grupos = [];
    const ufs = Object.entries(D.resumo.ufs);
    // seção: "BA 40 554", "ba zona 40 secao 554", "BA 40" (zona)
    const m = q.match(/^([a-z]{2})[\s,\/.-]*(?:z(?:ona)?\s*)?(\d{1,4})(?:[\s,\/.-]+(?:s(?:ec(?:ao)?)?\s*)?(\d{1,4}))?$/);
    if (m && D.resumo.ufs[m[1].toUpperCase()]) {
      const uf = m[1].toUpperCase();
      grupos.push(["Seção", [m[3] ? { t: `${D.resumo.ufs[uf].nome} · zona ${z4(+m[2])} · seção ${z4(+m[3])}`, s: "Boletim de urna e log da urna", h: `bu?uf=${uf}&zona=${+m[2]}&secao=${+m[3]}`, i: "bu" }
        : { t: `${D.resumo.ufs[uf].nome} · zona ${z4(+m[2])}`, s: "Todas as seções da zona", h: `bu?uf=${uf}&zona=${+m[2]}`, i: "bu" }]]);
    }
    if (q.length >= 2) {
      const est = ufs.filter(([k, u]) => norm(k) === q || norm(u.nome).includes(q)).slice(0, 4).map(([k, u]) => ({ t: u.nome, s: `Estado · ${k}`, h: `uf-${k}`, i: "local" }));
      if (est.length) grupos.push(["Estados", est]);
      const mun = D.resumo.indice_municipios.filter((r) => norm(r[2]).includes(q)).sort((a, b) => norm(a[2]).indexOf(q) - norm(b[2]).indexOf(q) || a[2].localeCompare(b[2])).slice(0, 8)
        .map((r) => ({ t: r[2], s: `Município · ${r[0]}`, h: `mun-${r[0]}-${r[1]}`, i: "local" }));
      if (mun.length) grupos.push(["Municípios", mun]);
    }
    const pags = PAGINAS.filter((p) => !q || norm(p.nome).includes(q) || p.chaves.split(" ").some((c) => c.startsWith(q))).map((p) => ({ t: p.nome, s: p.desc, h: p.r, i: p.r }));
    if (pags.length) grupos.push(["Páginas", pags]);
    itens = grupos.flatMap(([, l]) => l); ativo = 0;
    let k = 0;
    lista.innerHTML = grupos.length ? grupos.map(([g, l]) => `<li class="cmd-grupo">${g}</li>` + l.map((it) => `<li><button data-k="${k++}" class="${k === 1 ? "ativo" : ""}"><span class="cmd-ic">${icone(it.i)}</span><span><b>${esc(it.t)}</b><small>${esc(it.s)}</small></span></button></li>`).join("")).join("")
      : `<li class="cmd-vazio">Nada encontrado. Tente um município, um estado ou uma seção como “BA 40 554”.</li>`;
  }
  const ir = (it) => { fechar(); location.hash = it.h; };
  const realcar = () => lista.querySelectorAll("button").forEach((b) => { b.classList.toggle("ativo", +b.dataset.k === ativo); if (+b.dataset.k === ativo) b.scrollIntoView({ block: "nearest" }); });
  inp.addEventListener("input", buscar);
  inp.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { ativo = Math.min(itens.length - 1, ativo + 1); realcar(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { ativo = Math.max(0, ativo - 1); realcar(); e.preventDefault(); }
    else if (e.key === "Enter" && itens[ativo]) ir(itens[ativo]);
    else if (e.key === "Escape") { e.preventDefault(); fechar(); }
  });
  lista.addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) ir(itens[+b.dataset.k]); });
  dlg.addEventListener("click", (e) => { if (e.target === dlg) fechar(); });
  document.getElementById("cmd-abrir").addEventListener("click", abrir);
  document.addEventListener("keydown", (e) => {
    const emCampo = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || "");
    if ((e.key === "k" && (e.ctrlKey || e.metaKey)) || (e.key === "/" && !emCampo)) { e.preventDefault(); dlg.open ? fechar() : abrir(); }
  });
  document.getElementById("cmd-dicas").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { inp.value = b.textContent; buscar(); inp.focus(); } });
})();

new ResizeObserver(([e]) => document.documentElement.style.setProperty("--topo-h", Math.round(e.target.getBoundingClientRect().height) + "px")).observe(document.querySelector(".topo"));
(async function iniciar() {
  try { D.resumo = await json("dados/resumo.json"); }
  catch (e) { document.getElementById("app").innerHTML = `<p class="aviso">Não foi possível carregar os dados (${esc(e.message)}).</p>`; return; }
  rotear();
})();
