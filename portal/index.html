<style>
/* Layout: barra fixa com trilha de navegação (Brasil › UF › município) e coluna única de seções;

:root {

  --surface-2: #eef0ec;

  --accent-ink: #ffffff;
  --lula: #e34948;
  --flavio: #2a78d6;
  --renan: #1baf7a;
  --cury: #eda100;
  --caiado: #6250d6;
  --zema: #e87ba4;
  --outros: #a29f95;
  --branco: #cfcdc4;
  --nulo: #8f8c84;
  --abst: #4f4d48;
  --up: #b4501f;
  --down: #12796a;
  --mid: #eceae4;
  --ok: #0ca30c;
  --atencao: #fab219;
  --grave: #d03b3b;
  --f-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101311; --surface: #171b18; --surface-2: #1f2420; --ink: #eef1ec; --ink-2: #c0c7bf; --muted: #8b928b;
    --grid: #262c27; --axis: #3a413b; --line: rgba(255, 255, 255, 0.11); --accent: #3fb07a; --accent-ink: #0b1a11;
    --lula: #e66767; --flavio: #3987e5; --renan: #199e70; --cury: #c98500; --caiado: #9085e9; --zema: #d55181;
    --outros: #7d7a72; --branco: #5d5b55; --nulo: #8f8c84; --abst: #c9c6bc; --up: #e07a45; --down: #2fb39f; --mid: #33362f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101311; --surface: #171b18; --surface-2: #1f2420; --ink: #eef1ec; --ink-2: #c0c7bf; --muted: #8b928b;
  --grid: #262c27; --axis: #3a413b; --line: rgba(255, 255, 255, 0.11); --accent: #3fb07a; --accent-ink: #0b1a11;
  --lula: #e66767; --flavio: #3987e5; --renan: #199e70; --cury: #c98500; --caiado: #9085e9; --zema: #d55181;
  --outros: #7d7a72; --branco: #5d5b55; --nulo: #8f8c84; --abst: #c9c6bc; --up: #e07a45; --down: #2fb39f; --mid: #33362f;

}

@media (max-width: 560px) { .grafico { height: 320px; } .bloco { padding: 14px; } .placar { padding: 14px; } }

<script>
"use strict";
// ---------- formatação ----------
const NF = new Intl.NumberFormat("pt-BR");
const n0 = (v) => NF.format(Math.round(v));
const p1 = (v, d = 1) => (Number.isFinite(v) ? v : 0).toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d }) + "%";
const pp = (v, d = 1) => (v > 0 ? "+" : v < 0 ? "−" : "±") + Math.abs(v).toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d }) + " p.p.";
const sinal = (v) => (v > 0 ? "+" : v < 0 ? "−" : "") + n0(Math.abs(v));
const mi = (v) => Math.abs(v) >= 1e6 ? (v / 1e6).toLocaleString("pt-BR", { maximumFractionDigits: 2 }) + " mi"
  : Math.abs(v) >= 1e4 ? (v / 1e3).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " mil" : n0(v);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const z4 = (v) => String(v).padStart(4, "0");

// ---------- modelo de dados ----------
// t1: Lula, Flávio, Renan, Cury, Caiado, Zema, Outros, Branco, Nulo, Abst, Aptos
// t2: Lula, Flávio, Branco, Nulo, Abst, Aptos
const ORIG = ["Lula", "Flávio", "Renan", "Cury", "Caiado", "Zema", "Outros", "Branco", "Nulo", "Abst"];
const DEST = ["Lula", "Flávio", "Branco", "Nulo", "Abst"];
const ROT = { Lula: "Lula", "Flávio": "Flávio", Renan: "Renan Santos", Cury: "Augusto Cury", Caiado: "Ronaldo Caiado", Zema: "Zema",
  Outros: "Outros 6 candidatos", Branco: "Brancos", Nulo: "Nulos", Abst: "Abstenção" };
const COR = { Lula: "lula", "Flávio": "flavio", Renan: "renan", Cury: "cury", Caiado: "caiado", Zema: "zema", Outros: "outros", Branco: "branco", Nulo: "nulo", Abst: "abst" };
const COR_NUM = { 13: "Lula", 22: "Flávio", 14: "Renan", 70: "Cury", 55: "Caiado", 30: "Zema" };
const ELIM = ["Renan", "Cury", "Caiado", "Zema", "Outros"];

function agregado(t1, t2) {
  const val1 = t1.slice(0, 7).reduce((a, b) => a + b, 0), val2 = t2[0] + t2[1];
  const comp1 = t1[10] - t1[9], comp2 = t2[5] - t2[4];
  return {
    t1, t2, val1, val2, comp1, comp2, aptos1: t1[10], aptos2: t2[5],
    abst1: (100 * t1[9]) / t1[10], abst2: (100 * t2[4]) / t2[5],
    br1: (100 * t1[7]) / comp1, br2: (100 * t2[2]) / comp2, nu1: (100 * t1[8]) / comp1, nu2: (100 * t2[3]) / comp2,
    lula1: (100 * t1[0]) / val1, fla1: (100 * t1[1]) / val1, lula2: (100 * t2[0]) / val2, fla2: (100 * t2[1]) / val2,
    comparec1: (100 * comp1) / t1[10], comparec2: (100 * comp2) / t2[5],
  };
}
// fluxos em votos a partir de % por origem
function fluxoDe(pct, t1) { return pct.map((linha, k) => linha.map((p) => (p / 100) * t1[k])); }
function elimParaLula(F) {
  let l = 0, f = 0;
  ELIM.forEach((o) => { const k = ORIG.indexOf(o); l += F[k][0]; f += F[k][1]; });
  return l + f > 0 ? (100 * l) / (l + f) : NaN;
}

// ---------- tema ----------
let T = {};
function lerTema() {
  const cs = getComputedStyle(document.documentElement);
  const g = (v) => cs.getPropertyValue("--" + v).trim();
  T = { ink: g("ink"), ink2: g("ink-2"), muted: g("muted"), grid: g("grid"), axis: g("axis"), surface: g("surface"), bg: g("bg"),
    accent: g("accent"), up: g("up"), down: g("down"), mid: g("mid") };
  Object.values(COR).forEach((c) => (T[c] = g(c)));
}
const cor = (o) => T[COR[o]];

// ---------- gráficos ----------
const charts = [];
function novoGrafico(el, opt) {
  const c = echarts.init(el, null, { renderer: "canvas" });
  c.setOption(Object.assign({
    textStyle: { fontFamily: getComputedStyle(document.body).fontFamily, color: T.ink2 },
    animationDuration: 400,
    tooltip: { backgroundColor: T.surface, borderColor: T.axis, textStyle: { color: T.ink, fontSize: 13 }, extraCssText: "box-shadow:0 6px 20px rgba(0,0,0,.15);border-radius:8px;" },
  }, opt));
  charts.push(c);
  return c;
}
function limparGraficos() { while (charts.length) charts.pop().dispose(); }
window.addEventListener("resize", () => charts.forEach((c) => c.resize()));
const eixo = () => ({ axisLine: { lineStyle: { color: T.axis } }, axisTick: { show: false }, axisLabel: { color: T.ink2 }, splitLine: { lineStyle: { color: T.grid } } });

function kpi(rot, v1, v2, fmtv, invert, sub) {
  const d = v2 - v1;
  const cls = Math.abs(d) < 0.005 ? "" : (d > 0) !== !!invert ? "delta-up" : "delta-down";
  return `<div class="kpi"><span class="rot">${rot}</span><span class="val">${fmtv(v2)}</span>
    <span class="sub">1º turno: ${fmtv(v1)} · <span class="${cls}">${pp(d)}</span></span>${sub ? `<span class="sub">${sub}</span>` : ""}</div>`;
}
function htmlKpis(a) {
  return `<div class="kpis">

}

// Sankey 1º → 2º turno
function grafSankey(el, F, soMudancas) {
  const total = F.flat().reduce((a, b) => a + b, 0);
  const links = [];
  F.forEach((linha, k) => linha.forEach((v, j) => {
    const fica = ORIG[k] === DEST[j];
    if (soMudancas && fica) return;
    if (v / total < 0.0004) return;
    links.push({ source: ROT[ORIG[k]] + " · 1º", target: ROT[DEST[j]] + " · 2º", value: Math.round(v) });
  }));
  const usados = new Set(links.flatMap((l) => [l.source, l.target]));
  const nodes = [...ORIG.map((o) => ({ name: ROT[o] + " · 1º", o })), ...DEST.map((o) => ({ name: ROT[o] + " · 2º", o }))]
    .filter((n) => usados.has(n.name)).map((n) => ({ name: n.name, itemStyle: { color: cor(n.o), borderColor: cor(n.o) } }));
  novoGrafico(el, {
    tooltip: { trigger: "item", formatter: (p) => p.dataType === "edge"
      ? `${esc(p.data.source.replace(" · 1º", ""))} (1º) → ${esc(p.data.target.replace(" · 2º", ""))} (2º)<br><b>${n0(p.value)}</b> eleitores (estimativa)`
      : `<b>${esc(p.name)}</b><br>${n0(p.value)} eleitores` },
    series: [{ type: "sankey", left: 8, right: 130, top: 10, bottom: 10, nodeWidth: 12, nodeGap: 10, draggable: false,
      emphasis: { focus: "adjacency" }, data: nodes, links,
      lineStyle: { color: "gradient", opacity: 0.38, curveness: 0.5 },
      label: { color: T.ink, fontSize: 12, formatter: (p) => `${p.name.replace(/ · [12]º/, "")}  ${mi(p.value)}` } }],
  });
}

// ---------- tabela ordenável ----------
function tabela(cont, { colunas, linhas, porPagina = 50, busca, aoClicar, idSel }) {
  let ordem = { i: colunas.findIndex((c) => c.ordemPadrao), dir: -1 }, pagina = 0, filtro = "";
  if (ordem.i < 0) ordem.i = 0;
  cont.innerHTML = `${busca ? `<div class="ctrl"><input type="search" id="${busca.id}" placeholder="${esc(busca.placeholder)}" aria-label="${esc(busca.placeholder)}"><span class="nota" data-cont></span></div>` : ""}
    <div class="tabela-wrap"><table><thead><tr>${colunas.map((c, i) => `<th class="${c.n ? "n" : ""}" data-i="${i}" scope="col" title="${esc(c.dica || "")}">${c.t}</th>`).join("")}</tr></thead><tbody></tbody></table></div>
    <div class="pag" data-pag></div>`;
  const tbody = cont.querySelector("tbody"), pag = cont.querySelector("[data-pag]"), contador = cont.querySelector("[data-cont]");
  function desenhar() {
    let ls = filtro ? linhas.filter((l) => busca.campo(l).toLowerCase().includes(filtro)) : linhas.slice();
    const c = colunas[ordem.i];
    ls.sort((a, b) => { const x = c.v(a), y = c.v(b); return (typeof x === "string" ? x.localeCompare(y, "pt-BR") : x - y) * ordem.dir; });
    const nPag = Math.max(1, Math.ceil(ls.length / porPagina)); pagina = Math.min(pagina, nPag - 1);
    tbody.innerHTML = ls.slice(pagina * porPagina, (pagina + 1) * porPagina).map((l) =>
      `<tr data-id="${esc(l.id)}" class="${idSel && idSel() === l.id ? "sel" : ""}" tabindex="0">${colunas.map((c) => `<td class="${c.n ? "n" : ""}">${c.f ? c.f(l) : esc(c.v(l))}</td>`).join("")}</tr>`).join("");
    cont.querySelectorAll("th").forEach((th, i) => th.setAttribute("aria-sort", i === ordem.i ? (ordem.dir > 0 ? "ascending" : "descending") : "none"));
    pag.innerHTML = nPag > 1 ? `<button data-p="-1" ${pagina === 0 ? "disabled" : ""}>Anterior</button><span>Página ${pagina + 1} de ${nPag} · ${n0(ls.length)} linhas</span><button data-p="1" ${pagina >= nPag - 1 ? "disabled" : ""}>Próxima</button>` : `<span>${n0(ls.length)} linhas</span>`;
    if (contador) contador.textContent = filtro ? `${n0(ls.length)} encontrados` : "";
  }
  cont.querySelector("thead").addEventListener("click", (e) => { const th = e.target.closest("th"); if (!th) return; const i = +th.dataset.i;
    ordem = { i, dir: ordem.i === i ? -ordem.dir : (colunas[i].n ? -1 : 1) }; desenhar(); });
  pag.addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; pagina += +b.dataset.p; desenhar(); });
  if (busca) cont.querySelector("input").addEventListener("input", (e) => { filtro = e.target.value.trim().toLowerCase(); pagina = 0; desenhar(); });
  const clicar = (e) => { const tr = e.target.closest("tbody tr"); if (tr && aoClicar) aoClicar(linhas.find((l) => String(l.id) === tr.dataset.id)); };
  tbody.addEventListener("click", clicar);
  tbody.addEventListener("keydown", (e) => { if (e.key === "Enter") clicar(e); });
  desenhar();
  return { redesenhar: desenhar };
}

const GRADE = { RR: [0, 2], AP: [0, 4], AM: [1, 1], PA: [1, 3], MA: [1, 4], CE: [1, 5], RN: [1, 6], AC: [2, 0], RO: [2, 1], MT: [2, 2], TO: [2, 3], PI: [2, 4], PE: [2, 5], PB: [2, 6],
  MS: [3, 1], GO: [3, 2], DF: [3, 3], BA: [3, 4], SE: [3, 5], AL: [3, 6], PR: [4, 1], SP: [4, 2], MG: [4, 3], ES: [4, 4], SC: [5, 1], RJ: [5, 3], RS: [6, 1], ZZ: [6, 5] };
function misturar(c1, c2, t) {
  const h = (c) => { c = c.replace("#", ""); return [0, 2, 4].map((i) => parseInt(c.slice(i, i + 2), 16)); };
  const a = h(c1), b = h(c2);
  return "#" + a.map((x, i) => Math.round(x + (b[i] - x) * t).toString(16).padStart(2, "0")).join("");
}
function tintaPara(hex) { const c = hex.replace("#", ""); const [r, g, b] = [0, 2, 4].map((i) => parseInt(c.slice(i, i + 2), 16) / 255);
  return 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.55 ? "#111512" : "#ffffff"; }
const METRICAS_MAPA = {

    esc: ["Flávio +40 p.p.", "empate", "Lula +40 p.p."] },
  elim: { rot: "Eliminados → Lula", f: (a, uf) => elimParaLula(D.resumo.ufs[uf].migracao.votos), div: ["flavio", "lula"], centro: 50, lim: 35,

  abst: { rot: "Variação da abstenção", f: (a) => a.abst2 - a.abst1, div: ["down", "up"], lim: 8, txt: (v) => (v > 0 ? "+" : "") + v.toFixed(1),
    esc: ["−8 p.p.", "0", "+8 p.p."] },

function htmlMapa(metrica) {

    const fundo = t >= 0 ? misturar(T.mid, T[m.div[1]], t) : misturar(T.mid, T[m.div[0]], -t);
    return `<button class="tile" style="grid-row:${r + 1};grid-column:${c + 1};background:${fundo};color:${tintaPara(fundo)}" data-uf="${uf}"
      title="${esc(u.nome)}: ${esc(m.rot)} ${esc(m.txt(v))}" aria-label="${esc(u.nome)}: ${esc(m.rot)} ${esc(m.txt(v))}"><b>${uf === "ZZ" ? "Ext." : uf}</b><small>${m.txt(v)}</small></button>`;
  }).join("");
  return `<div class="mapa-wrap"><div class="mapa">${tiles}</div></div>
    <div class="escala"><span>${m.esc[0]}</span><i style="background:linear-gradient(90deg,${T[m.div[0]]},${T.mid},${T[m.div[1]]})"></i><span>${m.esc[2]}</span></div>`;
}

// ---------- seções comuns de Brasil e UF ----------
function htmlMigracaoResumo(F, t1, rotulo) {
  const card = (titulo, ks, sub) => {
    const tot = ks.reduce((s, k) => s + t1[k], 0); if (tot <= 0) return "";
    const dest = DEST.map((_, j) => ks.reduce((s, k) => s + F[k][j], 0));
    const pct = dest.map((v) => (100 * v) / tot);
    return `<div class="destaque"><h3>${titulo} <small>${mi(tot)} ${sub}</small></h3>
      <div class="mini" role="img" aria-label="${DEST.map((d, j) => ROT[d] + " " + p1(pct[j])).join(", ")}">${DEST.map((d, j) => `<i style="width:${pct[j]}%;background:var(--${COR[d]})"></i>`).join("")}</div>
      <div class="leg">${DEST.map((d, j) => `<span style="--c:var(--${COR[d]})">${ROT[d]} <b>${p1(pct[j])}</b></span>`).join("")}</div></div>`;
  };
  const ki = (o) => ORIG.indexOf(o);
  return `<div class="destaques">
    ${card("Eleitores dos eliminados", ELIM.map(ki), "votos")}
    ${ELIM.filter((o) => o !== "Outros").map((o) => card(ROT[o], [ki(o)], "votos")).join("")}
    ${card("Votaram branco ou nulo", [ki("Branco"), ki("Nulo")], "eleitores")}
    ${card("Não votaram no 1º turno", [ki("Abst")], "eleitores")}
  </div>`;
}

function htmlTabelaMatriz(mig, F, t1, sens) {
  const cab = DEST.map((d) => `<th class="n">${ROT[d]}</th>`).join("");
  const corpo = ORIG.map((o, k) => `<tr><td><span class="cand-dot" style="--c:var(--${COR[o]})"></span>${ROT[o]}</td><td class="n">${n0(t1[k])}</td>${DEST.map((_, j) => {
    const p = mig.pct[k][j];
    const ic = mig.ic90 ? `<br><small style="color:var(--muted)">${p1(mig.ic90[0][k][j])}–${p1(mig.ic90[1][k][j])}</small>` : "";
    const sv = sens ? `<br><small style="color:var(--muted)">zona: ${p1(sens.pct[k][j])}</small>` : "";
    return `<td class="n"><b>${p1(p)}</b> <small style="color:var(--muted)">${mi(F[k][j])}</small>${ic}${sv}</td>`;
  }).join("")}</tr>`).join("");
  return `<div class="tabela-wrap"><table><thead><tr><th style="cursor:default">1º turno ↓ · 2º turno →</th><th class="n" style="cursor:default">Eleitores</th>${cab}</tr></thead><tbody style="cursor:default">${corpo}</tbody></table></div>`;
}

      <div class="grafico" data-g="ganhos"></div>
    </section>
    <section class="bloco" id="matriz">

function colunasResultado(titulo, nome, comElim) {
  const cols = [
    { t: titulo, v: nome },
    { t: "Aptos", n: 1, v: (l) => l.a.aptos2, f: (l) => n0(l.a.aptos2), ordemPadrao: 1 },
    { t: "Lula 1º", n: 1, v: (l) => l.a.lula1, f: (l) => p1(l.a.lula1) },
    { t: "Flávio 1º", n: 1, v: (l) => l.a.fla1, f: (l) => p1(l.a.fla1) },
    { t: "Lula 2º", n: 1, v: (l) => l.a.lula2, f: (l) => barCel(l.a.lula2, "lula") },
    { t: "Flávio 2º", n: 1, v: (l) => l.a.fla2, f: (l) => p1(l.a.fla2) },
    { t: "Abst. 1º", n: 1, v: (l) => l.a.abst1, f: (l) => p1(l.a.abst1) },
    { t: "Abst. 2º", n: 1, v: (l) => l.a.abst2, f: (l) => p1(l.a.abst2) },
    { t: "Δ comparec.", n: 1, dica: "Variação do comparecimento, em pontos percentuais dos aptos", v: (l) => l.a.comparec2 - l.a.comparec1,
      f: (l) => `<span class="${l.a.comparec2 >= l.a.comparec1 ? "delta-down" : "delta-up"}">${pp(l.a.comparec2 - l.a.comparec1)}</span>` },
    { t: "Br+Nu 1º", n: 1, v: (l) => l.a.br1 + l.a.nu1, f: (l) => p1(l.a.br1 + l.a.nu1) },
    { t: "Br+Nu 2º", n: 1, v: (l) => l.a.br2 + l.a.nu2, f: (l) => p1(l.a.br2 + l.a.nu2) },
  ];
  if (comElim) cols.push({ t: "Eliminados → Lula", n: 1, dica: "Dos votos dos candidatos eliminados que foram para um finalista, % estimado que foi para Lula",
    v: (l) => (Number.isFinite(l.elim) ? l.elim : -1), f: (l) => (Number.isFinite(l.elim) ? p1(l.elim) : "—") });
  return cols;
}

async function visaoUF(app, uf) {

  app.innerHTML = `<div class="cabeca"><span class="olho">${esc(u.regiao)} · ${n0(u.municipios)} municípios · ${n0(u.secoes)} seções</span>

  const r2 = u.migracao.r2;
  montarAnalise(app, { rotulo: u.nome, t1: u.t1, t2: u.t2, cand1: u.cand1, mig: u.migracao, hist: R.hist_comparecimento[uf],
    migNota: `Estimativa feita com ${n0(u.migracao.secoes)} seções do estado. O modelo explica ${p1(100 * r2["Lula"], 0)} da variação do voto em Lula e ${p1(100 * r2["Flávio"], 0)} do voto em Flávio entre as seções.` });
  if (uf !== "ZZ") secaoMapa(app, uf);
  app.insertAdjacentHTML("beforeend", `<section class="bloco" id="municipios"><div class="bloco-cab"><div><span class="olho">${esc(u.nome)}</span><h2>Municípios</h2>
    <p class="lead">Clique numa linha para abrir o município.</p></div></div><div id="tab-mun"><p class="carregando">Carregando municípios…</p></div></section>`);
  const dados = await carregarUF(uf);
  if (location.hash !== "#uf-" + uf) return;
  const linhas = dados.municipios.map((m) => {
    const a = agregado(m.t1, m.t2);

  const cols = colunasResultado("Município", (l) => l.nome, true);

    aoClicar: (l) => (location.hash = `mun-${uf}-${l.id}`) });
  app.insertAdjacentHTML("beforeend", htmlMetodo());
}

// ---------- mapas ----------
const MAPA = { topo: null, ind: null, col: null, reg: {} };
async function carregarMapa() {
  if (!MAPA.topo) {
    const [t, i] = await Promise.all([json("dados/mapa/brasil.json"), json("dados/mapa/indicadores.json")]);
    Object.assign(MAPA, { topo: t, ind: i.municipios, col: Object.fromEntries(i.colunas.map((c, k) => [c, k])) });
  }
  return MAPA;
}

  const chave = uf || "BR";

    const fc = topojson.feature(MAPA.topo, MAPA.topo.objects.municipios);
    fc.features = fc.features.filter((f) => !uf || f.properties.uf === uf)
      .map((f) => ({ ...f, properties: { ...f.properties, name: `${f.properties.uf}-${f.properties.tse}` } }));
    echarts.registerMap("mun-" + chave, fc);
    const borda = uf ? null : topojson.mesh(MAPA.topo, MAPA.topo.objects.estados, (a, b) => a !== b);
    MAPA.reg[chave] = { nome: "mun-" + chave, bordas: borda ? borda.coordinates : [] };
  }
  return MAPA.reg[chave];
}
const ind = (k, c) => { const r = MAPA.ind[k]; return r ? r[MAPA.col[c]] : null; };
const METRICAS_MUN = {

  margem1: { rot: "Margem no 1º turno", col: "margem1", div: ["flavio", "lula"], lim: 50, fmt: (v) => (v >= 0 ? "Lula +" : "Flávio +") + Math.abs(v).toFixed(1).replace(".", ",") + " p.p.", ext: ["Flávio", "Lula"] },
  dlula: { rot: "Variação de Lula entre os turnos", col: "dlula", div: ["flavio", "lula"], lim: 6, fmt: (v) => pp(v), ext: ["Lula caiu", "Lula subiu"],

    ${lin("Troca de urna (contingência)", (r) => (v(r, "contingencia") ? `<b style="color:var(--up)">sim, às ${v(r, "t_contingencia")}</b>` : "não"))}
    ${lin("Zerésima impressa", (r) => v(r, "t_zeresima"))}
    ${lin("Urna pronta para votos", (r) => v(r, "t_pronta"))}
    ${lin("Primeiro e último voto", (r) => `${v(r, "t_primeiro_voto") || "—"} · ${v(r, "t_ultimo_voto") || "—"}`)}
    ${lin("Encerramento", (r) => v(r, "t_encerramento"))}
    ${lin("Votos no log × comparecimento no boletim", (r) => { const ok = v(r, "votos_log") === comp(v(r, "turno")); return `${n0(v(r, "votos_log"))} × ${n0(comp(v(r, "turno")))} ${ok ? "✓" : v(r, "contingencia") ? "(urna trocada)" : "<b style=\"color:var(--up)\">≠</b>"}`; })}
    ${lin("Habilitação por biometria", (r) => p1((100 * v(r, "hab_biometrica")) / Math.max(1, v(r, "votos_log")), 0) + ` · ${n0(v(r, "hab_manual"))} manuais`)}
    ${lin("Votos depois das 17h (fila)", (r) => n0(v(r, "votos_apos_17h")))}
    ${lin("Tempo típico de votação", (r) => (v(r, "tempo_mediano_s") == null ? "—" : v(r, "tempo_mediano_s") + " s"))}
    ${lin("Reinícios durante a votação", (r) => n0(v(r, "ligadas_apos_pronta")))}
    ${lin("Erros (fora a rotina) · alertas", (r) => `${n0(v(r, "erros_relevantes"))} · ${n0(v(r, "alertas"))}`)}
    ${lin("Votos não registrados (erro)", (r) => (v(r, "voto_nao_registrado") ? `<b style="color:var(--up)">${v(r, "voto_nao_registrado")}</b>` : "0"))}
    ${C.mesario_max_hab != null ? `
    ${lin("Identificados pelo CPF", (r) => (v(r, "id_cpf") == null ? "—" : n0(v(r, "id_cpf"))))}
    ${lin("Ano de nascimento conferido · não conferiu", (r) => (v(r, "ano_nasc_confere") == null ? "—" : `${n0(v(r, "ano_nasc_confere"))} · ${n0(v(r, "ano_nasc_diferente"))}`))}
    ${lin("Habilitações autorizadas por mesário (máx. por um mesário)", (r) => (v(r, "hab_por_mesario") == null ? "—" : `${n0(v(r, "hab_por_mesario"))} (${n0(v(r, "mesario_max_hab"))} por ${n0(v(r, "mesarios_que_habilitaram"))} mesário${v(r, "mesarios_que_habilitaram") === 1 ? "" : "s"})`))}
    ${lin("“O eleitor identificado já votou” · impedidos", (r) => (v(r, "eleitor_ja_votou") == null ? "—" : `${n0(v(r, "eleitor_ja_votou"))} · ${n0(v(r, "eleitor_impedido"))}`))}
    ${lin("Correções na cabine · justificativas", (r) => (v(r, "correcoes") == null ? "—" : `${n0(v(r, "correcoes"))} · ${n0(v(r, "justificativas"))}`))}
    ${lin("Minutos na bateria (falta de energia)", (r) => (v(r, "bateria_min") == null ? "—" : n0(v(r, "bateria_min"))))}
    ${lin("Tentativas de encerrar antes das 17h · encerrada com presentes", (r) => (v(r, "encerr_cedo_tentativa") == null ? "—" : `${n0(v(r, "encerr_cedo_tentativa"))} · ${v(r, "encerr_com_presentes") ? "sim" : "não"}`))}` : ""}
    </tbody></table></div><p class="nota">Horários locais da urna. Fonte: log da urna publicado pelo TSE (arquivos transmitidos para totalização).</p>`;
}

    const msgs = LG.mensagens[turno].map(([nivel, msg, n, ufs], i) => ({ id: i, nivel, msg, n, ufs }));

function desenharAmpliada(app, LG) {
  const A = LG.ampliada || {};
  if (!A["1"] && !A["2"]) return;
  const elH = app.querySelector('[data-g="log-hora"]');
  const pct = (v) => { const t = v.reduce((a, b) => a + b, 0) || 1; return v.map((x) => +((100 * x) / t).toFixed(2)); };
  const horas = Array.from({ length: 24 }, (_, i) => i).filter((h) => h >= 7 && h <= 19);
  novoGrafico(elH, {
    legend: { top: 0, left: 0, textStyle: { color: T.ink2 } }, grid: { left: 8, right: 16, top: 34, bottom: 8, containLabel: true },
    tooltip: { trigger: "axis", formatter: (ps) => `<b>${ps[0].axisValue}</b><br>` + ps.map((p) => `${p.marker}${p.seriesName}: <b>${p1(p.value)}</b> dos votos`).join("<br>") },

function htmlMetodoLogs() {
  return `<section class="bloco"><div class="bloco-cab"><div><span class="olho">Como foi calculado</span><h2>Fonte e método dos logs</h2></div></div><div class="metodo">

    <p><b>Recorte.</b> De cada log, só os eventos do dia da eleição do turno (04/10 ou 25/10). Horários convertidos para o de Brasília quando comparados com 8h e 17h; no exterior, não há comparação de horário.</p>
    <p><b>Definições.</b> Troca de urna: mensagens de contingência no log. Pronta no horário: "Urna pronta para receber votos" até 5 minutos depois das 8h. Erro fora da rotina: mensagens de nível ERRO, exceto "Problema ao desmontar a MR", registrada em quase toda urna ao retirar a mídia de resultado. Reinício: urna religada entre a abertura e o encerramento. Habilitação manual: votos no log menos habilitações por biometria.</p>
    <p><b>Limites.</b> O log descreve o funcionamento da urna; ele não registra em quem cada eleitor votou. Ocorrências como troca de urna ou erro de leitura biométrica fazem parte da operação normal e têm procedimentos próprios; o que a análise verifica é se elas se concentram em algum lugar ou se associam a mudança de voto. Código: scripts 16_logs_urnas.py e 17_analise_logs.py.</p>
  </div></section>`;
}

// ---------- metodologia ----------
function htmlMetodo() {
  const R = D.resumo;
  return `<section class="bloco" id="metodo"><div class="bloco-cab"><div><span class="olho">Como foi calculado</span><h2>Metodologia e fontes</h2></div></div>
  <div class="metodo">
    <p><b>Resultados.</b> Todos os votos, brancos, nulos, abstenções e aptos são os números oficiais do TSE (Portal de Dados Abertos, arquivos <span class="mono">votacao_secao</span>, <span class="mono">detalhe_votacao_secao</span> e <span class="mono">votacao_candidato_munzona</span> de 2026). A soma das ${n0(R.secoes)} seções confere exatamente com os totais oficiais. Nulos incluem os nulos técnicos.</p>
    <p><b>Migração de votos é uma estimativa.</b> O voto é secreto, então não existe registro de como cada eleitor votou nos dois turnos. A migração é estimada por inferência ecológica: em cada seção, a composição do 2º turno é modelada como uma combinação da composição do 1º. A matriz de transição (que fração de cada escolha do 1º turno foi para cada opção do 2º) é obtida por mínimos quadrados ponderados pelo eleitorado da seção, com cada linha somando 100% e sem valores negativos.</p>
    <p><b>Brasil, estados e municípios.</b> Cada estado tem sua própria matriz, estimada com as suas seções. O Brasil e as regiões somam os fluxos de cada estado. Nos municípios, a estimativa é combinada com a do estado: quanto menos seções o município tem, mais ela se aproxima do padrão estadual.</p>
    <p><b>Incerteza.</b> Os intervalos de 90% vêm de um bootstrap das seções e medem só a variação amostral, por isso são estreitos. A principal fonte de incerteza é a premissa de que eleitores com a mesma escolha no 1º turno se comportam de modo parecido dentro do estado. Para dar uma ideia dela, a tabela da matriz mostra também a estimativa feita com zonas eleitorais em vez de seções: onde as duas divergem (por exemplo, nos eleitores de Renan Santos), leia a estimativa como uma faixa. Fluxos dos finalistas, de brancos, nulos e abstenção e o total dos eliminados são os mais estáveis.</p>
    <p><b>Código e dados.</b> <a href="https://github.com/adriano-atanes/analise-eleicao-presidente-2026" target="_blank" rel="noopener">github.com/adriano-atanes/analise-eleicao-presidente-2026</a>. Dados gerados em ${esc(R.gerado_em)}.</p>
  </div></section>`;
}

(function busca() {
  const inp = document.getElementById("busca"), ul = document.getElementById("busca-lista");
  const norm = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  let res = [], ativo = 0;
  function mostrar() {
    ul.innerHTML = res.map((r, i) => `<li><button class="${i === ativo ? "ativo" : ""}" data-i="${i}">${esc(r[2])}<small>${r[0]}</small></button></li>`).join("");
    ul.hidden = res.length === 0;
  }
  inp.addEventListener("input", () => {
    const q = norm(inp.value.trim()); ativo = 0;
    if (q.length < 2 || !D.resumo) { res = []; return mostrar(); }
    res = D.resumo.indice_municipios.filter((r) => norm(r[2]).includes(q)).sort((a, b) => norm(a[2]).indexOf(q) - norm(b[2]).indexOf(q) || a[2].localeCompare(b[2])).slice(0, 12);
    mostrar();
  });
  const ir = (r) => { location.hash = `mun-${r[0]}-${r[1]}`; inp.value = ""; res = []; mostrar(); inp.blur(); };
  inp.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { ativo = Math.min(res.length - 1, ativo + 1); mostrar(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { ativo = Math.max(0, ativo - 1); mostrar(); e.preventDefault(); }
    else if (e.key === "Enter" && res[ativo]) ir(res[ativo]);
    else if (e.key === "Escape") { res = []; mostrar(); }
  });
  ul.addEventListener("mousedown", (e) => { const b = e.target.closest("button"); if (b) { e.preventDefault(); ir(res[+b.dataset.i]); } });
  inp.addEventListener("blur", () => setTimeout(() => { ul.hidden = true; }, 150));
})();
