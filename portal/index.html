<title>Eleição Presidencial 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra fixa com trilha de navegação (Brasil › UF › município) e coluna única de seções;
   os teclados da urna (CONFIRMA verde, BRANCO, CORRIGE) inspiram o acento e os neutros. */
:root {
  --bg: #f6f7f5;
  --surface: #ffffff;
  --surface-2: #eef0ec;
  --ink: #111512;
  --ink-2: #4b524c;
  --muted: #7d847e;
  --grid: #e3e6e1;
  --axis: #c3c8c1;
  --line: rgba(17, 21, 18, 0.12);
  --accent: #1d7a4c;
  --accent-ink: #ffffff;
  --lula: #e34948;
  --flavio: #2a78d6;
  --renan: #1baf7a;
  --cury: #eda100;
  --caiado: #6250d6;
  --zema: #e87ba4;
  --outros: #a29f95;
  --branco: #cfcdc4;
  --nulo: #8f8c84;
  --abst: #4f4d48;
  --up: #b4501f;
  --down: #12796a;
  --mid: #eceae4;
  --ok: #0ca30c;
  --atencao: #fab219;
  --grave: #d03b3b;
  --f-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101311; --surface: #171b18; --surface-2: #1f2420; --ink: #eef1ec; --ink-2: #c0c7bf; --muted: #8b928b;
    --grid: #262c27; --axis: #3a413b; --line: rgba(255, 255, 255, 0.11); --accent: #3fb07a; --accent-ink: #0b1a11;
    --lula: #e66767; --flavio: #3987e5; --renan: #199e70; --cury: #c98500; --caiado: #9085e9; --zema: #d55181;
    --outros: #7d7a72; --branco: #5d5b55; --nulo: #8f8c84; --abst: #c9c6bc; --up: #e07a45; --down: #2fb39f; --mid: #33362f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101311; --surface: #171b18; --surface-2: #1f2420; --ink: #eef1ec; --ink-2: #c0c7bf; --muted: #8b928b;
  --grid: #262c27; --axis: #3a413b; --line: rgba(255, 255, 255, 0.11); --accent: #3fb07a; --accent-ink: #0b1a11;
  --lula: #e66767; --flavio: #3987e5; --renan: #199e70; --cury: #c98500; --caiado: #9085e9; --zema: #d55181;
  --outros: #7d7a72; --branco: #5d5b55; --nulo: #8f8c84; --abst: #c9c6bc; --up: #e07a45; --down: #2fb39f; --mid: #33362f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, td.n, th.n { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); font-size: 0.86em; }

.topo { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topo-in { max-width: 1180px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding-block: 10px; }
.marca { font-family: var(--f-display); font-weight: 800; font-stretch: 75%; font-size: 20px; letter-spacing: 0.01em; text-decoration: none; color: var(--ink); white-space: nowrap; }
.marca span { color: var(--accent); }
.nav-aud { font-size: 14px; font-weight: 600; text-decoration: none; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; white-space: nowrap; }
.nav-aud:hover, .nav-aud[aria-current="page"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); white-space: nowrap; }
.status i { font-style: normal; width: 16px; height: 16px; border-radius: 50%; display: inline-grid; place-content: center; font-size: 11px; color: #111512; background: var(--c); }
.testes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr)); gap: 12px; }
.teste { border: 1px solid var(--line); border-radius: 10px; padding: 14px; background: var(--bg); display: grid; gap: 6px; align-content: start; }
.teste h3 { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
.teste p { margin: 0; font-size: 13.5px; color: var(--ink-2); }
.chip { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); margin: 1px 3px 1px 0; white-space: nowrap; }
.filtro-uf { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 58px); z-index: 4; background: var(--bg); padding-block: 8px; border-bottom: 1px solid var(--line); }
.filtro-uf select, #sel-ano-mun { padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.passos { margin: 0; padding-left: 20px; display: grid; gap: 6px; color: var(--ink-2); max-width: 82ch; }
.trilha { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 14px; color: var(--ink-2); flex: 1 1 260px; min-width: 0; }
.trilha a { color: var(--ink-2); text-decoration: none; padding: 2px 6px; border-radius: 4px; }
.trilha a:hover { background: var(--surface-2); color: var(--ink); }
.trilha b { color: var(--ink); padding: 2px 6px; }
.busca { position: relative; flex: 0 1 300px; min-width: 200px; }
.busca input { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.busca ul { position: absolute; left: 0; right: 0; top: calc(100% + 4px); list-style: none; margin: 0; padding: 4px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.12); max-height: 320px; overflow: auto; z-index: 6; }
.busca li button { width: 100%; text-align: left; background: none; border: 0; padding: 6px 8px; border-radius: 5px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
.busca li button:hover, .busca li button.ativo { background: var(--surface-2); }
.busca li small { color: var(--muted); font-family: var(--f-mono); }

main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 64px; }
.col { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }
.col > *, .bloco > *, #sec-corpo > *, .ficha > * { min-width: 0; }

.cabeca { display: grid; gap: 6px; }
.olho { font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--f-display); font-weight: 800; font-stretch: 78%; font-size: clamp(30px, 5vw, 48px); line-height: 1.02; margin: 0; text-wrap: balance; letter-spacing: -0.005em; }
h2 { font-family: var(--f-display); font-weight: 700; font-stretch: 85%; font-size: 24px; line-height: 1.15; margin: 0; text-wrap: balance; }
h3 { font-family: var(--f-display); font-weight: 700; font-stretch: 90%; font-size: 17px; margin: 0; }
.lead { color: var(--ink-2); max-width: 70ch; margin: 0; }
.nota { color: var(--muted); font-size: 13px; max-width: 80ch; margin: 0; }

.placar { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: grid; gap: 14px; }
.placar-nomes { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.placar-nomes div { display: grid; gap: 0; }
.placar-nomes div:last-child { text-align: right; }
.placar-nomes strong { font-family: var(--f-display); font-stretch: 80%; font-weight: 800; font-size: clamp(28px, 4.4vw, 40px); line-height: 1; }
.placar-nomes span { color: var(--ink-2); font-size: 14px; }
.barra2 { display: flex; height: 14px; border-radius: 4px; overflow: hidden; gap: 2px; background: var(--surface); position: relative; }
.barra2 i { display: block; height: 100%; }
.barra2::after { content: ""; position: absolute; left: 50%; top: -4px; bottom: -4px; width: 1px; background: var(--ink); opacity: .5; }
.selo { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }
.selo::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--accent)); }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 4px; align-content: start; }
.kpi .rot { font-size: 13px; color: var(--ink-2); }
.kpi .val { font-family: var(--f-display); font-stretch: 85%; font-weight: 700; font-size: 26px; line-height: 1.1; }
.kpi .sub { font-size: 13px; color: var(--muted); }
.delta-up { color: var(--up); font-weight: 600; }
.delta-down { color: var(--down); font-weight: 600; }

.bloco { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; min-width: 0; }
.bloco-cab { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 10px 20px; }
.bloco-cab > div:not(.seg) { display: grid; gap: 4px; min-width: 0; max-width: 72ch; }
.grade2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 20px; }
.grade2 > * { min-width: 0; }
.grafico { width: 100%; height: 360px; min-width: 0; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--bg); flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 12px; cursor: pointer; font-size: 13px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

.destaques { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 12px; }
.destaque { border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 8px; background: var(--bg); }
.destaque h3 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.destaque h3 small { font-family: var(--f-body); font-weight: 400; font-size: 13px; color: var(--muted); font-stretch: 100%; }
.mini { display: flex; height: 10px; border-radius: 3px; overflow: hidden; gap: 2px; }
.mini i { display: block; height: 100%; min-width: 1px; }
.leg { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--ink-2); }
.leg span { display: inline-flex; align-items: center; gap: 5px; }
.leg span::before { content: ""; width: 10px; height: 10px; border-radius: 2px; background: var(--c); }
.leg b { color: var(--ink); font-variant-numeric: tabular-nums; }

.mapa-wrap { overflow-x: auto; }
.mapa { display: grid; grid-template-columns: repeat(7, minmax(48px, 1fr)); gap: 4px; min-width: 380px; max-width: 560px; }
.tile { aspect-ratio: 1 / 0.86; border: 0; border-radius: 6px; cursor: pointer; display: grid; place-content: center; text-align: center; padding: 2px; line-height: 1.1; }
.tile b { font-family: var(--f-display); font-stretch: 85%; font-size: 15px; }
.tile small { font-size: 11px; font-variant-numeric: tabular-nums; }
.tile:hover { outline: 2px solid var(--ink); outline-offset: 1px; }
.escala { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); flex-wrap: wrap; }
.escala i { display: block; width: 180px; max-width: 50vw; height: 10px; border-radius: 3px; }

.tabela-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th { font-weight: 600; color: var(--ink-2); background: var(--surface-2); position: sticky; top: 0; cursor: pointer; user-select: none; }
th[aria-sort="ascending"]::after { content: " ↑"; } th[aria-sort="descending"]::after { content: " ↓"; }
td.n, th.n { text-align: right; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--surface-2); }
tbody tr.sel { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.ctrl { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.ctrl input[type=search] { padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); min-width: 0; flex: 1 1 200px; max-width: 320px; }
.pag { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--ink-2); }
.pag button { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.pag button:disabled { opacity: .4; cursor: default; }
.bar-cel { display: inline-block; width: 60px; height: 8px; border-radius: 2px; background: var(--grid); vertical-align: middle; margin-left: 6px; overflow: hidden; position: relative; }
.bar-cel i { position: absolute; inset: 0 auto 0 0; background: var(--c); }

.ficha { border: 1px solid var(--line); border-radius: 10px; padding: 16px; background: var(--bg); display: grid; gap: 12px; }
.ficha table td:first-child { color: var(--ink-2); }
.cand-dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; background: var(--c); margin-right: 6px; vertical-align: 1px; }

.metodo { display: grid; gap: 10px; color: var(--ink-2); max-width: 82ch; }
.metodo p { margin: 0; }
.carregando { color: var(--muted); padding: 40px 0; text-align: center; }
.aviso { border-left: 3px solid var(--cury); padding: 8px 12px; background: var(--surface-2); border-radius: 0 6px 6px 0; font-size: 13.5px; color: var(--ink-2); }
footer { max-width: 1180px; margin: 0 auto; color: var(--muted); font-size: 13px; display: grid; gap: 4px; padding-top: 8px; }
@media (max-width: 560px) { .grafico { height: 320px; } .bloco { padding: 14px; } .placar { padding: 14px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

  <div class="topo-in">
    <a class="marca" href="#">Presidente<span>/</span>2026</a>

    <div class="busca">
      <input id="busca" type="search" placeholder="Buscar município…" autocomplete="off" aria-label="Buscar município">

<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<script>
"use strict";
// ---------- formatação ----------
const NF = new Intl.NumberFormat("pt-BR");
const n0 = (v) => NF.format(Math.round(v));
const p1 = (v, d = 1) => (Number.isFinite(v) ? v : 0).toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d }) + "%";
const pp = (v, d = 1) => (v > 0 ? "+" : v < 0 ? "−" : "±") + Math.abs(v).toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d }) + " p.p.";
const sinal = (v) => (v > 0 ? "+" : v < 0 ? "−" : "") + n0(Math.abs(v));
const mi = (v) => Math.abs(v) >= 1e6 ? (v / 1e6).toLocaleString("pt-BR", { maximumFractionDigits: 2 }) + " mi"
  : Math.abs(v) >= 1e4 ? (v / 1e3).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " mil" : n0(v);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const z4 = (v) => String(v).padStart(4, "0");

// ---------- modelo de dados ----------
// t1: Lula, Flávio, Renan, Cury, Caiado, Zema, Outros, Branco, Nulo, Abst, Aptos
// t2: Lula, Flávio, Branco, Nulo, Abst, Aptos
const ORIG = ["Lula", "Flávio", "Renan", "Cury", "Caiado", "Zema", "Outros", "Branco", "Nulo", "Abst"];
const DEST = ["Lula", "Flávio", "Branco", "Nulo", "Abst"];
const ROT = { Lula: "Lula", "Flávio": "Flávio", Renan: "Renan Santos", Cury: "Augusto Cury", Caiado: "Ronaldo Caiado", Zema: "Zema",
  Outros: "Outros 6 candidatos", Branco: "Brancos", Nulo: "Nulos", Abst: "Abstenção" };
const COR = { Lula: "lula", "Flávio": "flavio", Renan: "renan", Cury: "cury", Caiado: "caiado", Zema: "zema", Outros: "outros", Branco: "branco", Nulo: "nulo", Abst: "abst" };
const COR_NUM = { 13: "Lula", 22: "Flávio", 14: "Renan", 70: "Cury", 55: "Caiado", 30: "Zema" };
const ELIM = ["Renan", "Cury", "Caiado", "Zema", "Outros"];

function agregado(t1, t2) {
  const val1 = t1.slice(0, 7).reduce((a, b) => a + b, 0), val2 = t2[0] + t2[1];
  const comp1 = t1[10] - t1[9], comp2 = t2[5] - t2[4];
  return {
    t1, t2, val1, val2, comp1, comp2, aptos1: t1[10], aptos2: t2[5],
    abst1: (100 * t1[9]) / t1[10], abst2: (100 * t2[4]) / t2[5],
    br1: (100 * t1[7]) / comp1, br2: (100 * t2[2]) / comp2, nu1: (100 * t1[8]) / comp1, nu2: (100 * t2[3]) / comp2,
    lula1: (100 * t1[0]) / val1, fla1: (100 * t1[1]) / val1, lula2: (100 * t2[0]) / val2, fla2: (100 * t2[1]) / val2,
    comparec1: (100 * comp1) / t1[10], comparec2: (100 * comp2) / t2[5],
  };
}
// fluxos em votos a partir de % por origem
function fluxoDe(pct, t1) { return pct.map((linha, k) => linha.map((p) => (p / 100) * t1[k])); }
function elimParaLula(F) {
  let l = 0, f = 0;
  ELIM.forEach((o) => { const k = ORIG.indexOf(o); l += F[k][0]; f += F[k][1]; });
  return l + f > 0 ? (100 * l) / (l + f) : NaN;
}

// ---------- tema ----------
let T = {};
function lerTema() {
  const cs = getComputedStyle(document.documentElement);
  const g = (v) => cs.getPropertyValue("--" + v).trim();
  T = { ink: g("ink"), ink2: g("ink-2"), muted: g("muted"), grid: g("grid"), axis: g("axis"), surface: g("surface"), bg: g("bg"),
    accent: g("accent"), up: g("up"), down: g("down"), mid: g("mid") };
  Object.values(COR).forEach((c) => (T[c] = g(c)));
}
const cor = (o) => T[COR[o]];

// ---------- gráficos ----------
const charts = [];
function novoGrafico(el, opt) {
  const c = echarts.init(el, null, { renderer: "canvas" });
  c.setOption(Object.assign({
    textStyle: { fontFamily: getComputedStyle(document.body).fontFamily, color: T.ink2 },
    animationDuration: 400,
    tooltip: { backgroundColor: T.surface, borderColor: T.axis, textStyle: { color: T.ink, fontSize: 13 }, extraCssText: "box-shadow:0 6px 20px rgba(0,0,0,.15);border-radius:8px;" },
  }, opt));
  charts.push(c);
  return c;
}
function limparGraficos() { while (charts.length) charts.pop().dispose(); }
window.addEventListener("resize", () => charts.forEach((c) => c.resize()));
const eixo = () => ({ axisLine: { lineStyle: { color: T.axis } }, axisTick: { show: false }, axisLabel: { color: T.ink2 }, splitLine: { lineStyle: { color: T.grid } } });

// ---------- dados ----------
const D = { resumo: null, uf: {}, secoes: {} };
async function json(url) { const r = await fetch(url); if (!r.ok) throw new Error(url + ": " + r.status); return r.json(); }
async function carregarUF(uf) { return (D.uf[uf] ||= await json(`dados/uf/${uf}.json`)); }
async function carregarAuditoria() { D.comp ||= await json("dados/comportamento.json"); return (D.aud ||= await json("dados/auditoria.json")); }
async function carregarSecoes(uf) { return (D.secoes[uf] ||= await json(`dados/secoes/${uf}.json`)); }

// ---------- componentes ----------
function htmlPlacar(a, rotulo) {
  const vence = a.lula2 >= a.fla2 ? "Lula" : "Flávio";
  return `<div class="placar">
    <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center">
      <span class="olho">2º turno · 25/10/2026 · ${esc(rotulo)}</span>

// Sankey 1º → 2º turno
function grafSankey(el, F, soMudancas) {
  const total = F.flat().reduce((a, b) => a + b, 0);

  F.forEach((linha, k) => linha.forEach((v, j) => {
    const fica = ORIG[k] === DEST[j];
    if (soMudancas && fica) return;
    if (v / total < 0.0004) return;
    links.push({ source: ROT[ORIG[k]] + " · 1º", target: ROT[DEST[j]] + " · 2º", value: Math.round(v) });
  }));
  const usados = new Set(links.flatMap((l) => [l.source, l.target]));
  const nodes = [...ORIG.map((o) => ({ name: ROT[o] + " · 1º", o })), ...DEST.map((o) => ({ name: ROT[o] + " · 2º", o }))]
    .filter((n) => usados.has(n.name)).map((n) => ({ name: n.name, itemStyle: { color: cor(n.o), borderColor: cor(n.o) } }));
  novoGrafico(el, {
    tooltip: { trigger: "item", formatter: (p) => p.dataType === "edge"

    series: [{ type: "sankey", left: 8, right: 130, top: 10, bottom: 10, nodeWidth: 12, nodeGap: 10, draggable: false,
      emphasis: { focus: "adjacency" }, data: nodes, links,
      lineStyle: { color: "gradient", opacity: 0.38, curveness: 0.5 },

// ---------- tabela ordenável ----------
function tabela(cont, { colunas, linhas, porPagina = 50, busca, aoClicar, idSel }) {
  let ordem = { i: colunas.findIndex((c) => c.ordemPadrao), dir: -1 }, pagina = 0, filtro = "";
  if (ordem.i < 0) ordem.i = 0;
  cont.innerHTML = `${busca ? `<div class="ctrl"><input type="search" id="${busca.id}" placeholder="${esc(busca.placeholder)}" aria-label="${esc(busca.placeholder)}"><span class="nota" data-cont></span></div>` : ""}
    <div class="tabela-wrap"><table><thead><tr>${colunas.map((c, i) => `<th class="${c.n ? "n" : ""}" data-i="${i}" scope="col" title="${esc(c.dica || "")}">${c.t}</th>`).join("")}</tr></thead><tbody></tbody></table></div>
    <div class="pag" data-pag></div>`;
  const tbody = cont.querySelector("tbody"), pag = cont.querySelector("[data-pag]"), contador = cont.querySelector("[data-cont]");
  function desenhar() {
    let ls = filtro ? linhas.filter((l) => busca.campo(l).toLowerCase().includes(filtro)) : linhas.slice();
    const c = colunas[ordem.i];
    ls.sort((a, b) => { const x = c.v(a), y = c.v(b); return (typeof x === "string" ? x.localeCompare(y, "pt-BR") : x - y) * ordem.dir; });
    const nPag = Math.max(1, Math.ceil(ls.length / porPagina)); pagina = Math.min(pagina, nPag - 1);
    tbody.innerHTML = ls.slice(pagina * porPagina, (pagina + 1) * porPagina).map((l) =>
      `<tr data-id="${esc(l.id)}" class="${idSel && idSel() === l.id ? "sel" : ""}" tabindex="0">${colunas.map((c) => `<td class="${c.n ? "n" : ""}">${c.f ? c.f(l) : esc(c.v(l))}</td>`).join("")}</tr>`).join("");
    cont.querySelectorAll("th").forEach((th, i) => th.setAttribute("aria-sort", i === ordem.i ? (ordem.dir > 0 ? "ascending" : "descending") : "none"));
    pag.innerHTML = nPag > 1 ? `<button data-p="-1" ${pagina === 0 ? "disabled" : ""}>Anterior</button><span>Página ${pagina + 1} de ${nPag} · ${n0(ls.length)} linhas</span><button data-p="1" ${pagina >= nPag - 1 ? "disabled" : ""}>Próxima</button>` : `<span>${n0(ls.length)} linhas</span>`;
    if (contador) contador.textContent = filtro ? `${n0(ls.length)} encontrados` : "";
  }
  cont.querySelector("thead").addEventListener("click", (e) => { const th = e.target.closest("th"); if (!th) return; const i = +th.dataset.i;
    ordem = { i, dir: ordem.i === i ? -ordem.dir : (colunas[i].n ? -1 : 1) }; desenhar(); });
  pag.addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; pagina += +b.dataset.p; desenhar(); });
  if (busca) cont.querySelector("input").addEventListener("input", (e) => { filtro = e.target.value.trim().toLowerCase(); pagina = 0; desenhar(); });
  const clicar = (e) => { const tr = e.target.closest("tbody tr"); if (tr && aoClicar) aoClicar(linhas.find((l) => String(l.id) === tr.dataset.id)); };
  tbody.addEventListener("click", clicar);
  tbody.addEventListener("keydown", (e) => { if (e.key === "Enter") clicar(e); });
  desenhar();
  return { redesenhar: desenhar };
}

function misturar(c1, c2, t) {

const METRICAS_MAPA = {

function colunasResultado(titulo, nome, comElim) {
  const cols = [
    { t: titulo, v: nome },
    { t: "Aptos", n: 1, v: (l) => l.a.aptos2, f: (l) => n0(l.a.aptos2), ordemPadrao: 1 },
    { t: "Lula 1º", n: 1, v: (l) => l.a.lula1, f: (l) => p1(l.a.lula1) },
    { t: "Flávio 1º", n: 1, v: (l) => l.a.fla1, f: (l) => p1(l.a.fla1) },
    { t: "Lula 2º", n: 1, v: (l) => l.a.lula2, f: (l) => barCel(l.a.lula2, "lula") },
    { t: "Flávio 2º", n: 1, v: (l) => l.a.fla2, f: (l) => p1(l.a.fla2) },
    { t: "Abst. 1º", n: 1, v: (l) => l.a.abst1, f: (l) => p1(l.a.abst1) },
    { t: "Abst. 2º", n: 1, v: (l) => l.a.abst2, f: (l) => p1(l.a.abst2) },
    { t: "Δ comparec.", n: 1, dica: "Variação do comparecimento, em pontos percentuais dos aptos", v: (l) => l.a.comparec2 - l.a.comparec1,
      f: (l) => `<span class="${l.a.comparec2 >= l.a.comparec1 ? "delta-down" : "delta-up"}">${pp(l.a.comparec2 - l.a.comparec1)}</span>` },
    { t: "Br+Nu 1º", n: 1, v: (l) => l.a.br1 + l.a.nu1, f: (l) => p1(l.a.br1 + l.a.nu1) },
    { t: "Br+Nu 2º", n: 1, v: (l) => l.a.br2 + l.a.nu2, f: (l) => p1(l.a.br2 + l.a.nu2) },
  ];
  if (comElim) cols.push({ t: "Eliminados → Lula", n: 1, dica: "Dos votos dos candidatos eliminados que foram para um finalista, % estimado que foi para Lula",
    v: (l) => (Number.isFinite(l.elim) ? l.elim : -1), f: (l) => (Number.isFinite(l.elim) ? p1(l.elim) : "—") });
  return cols;
}

        { t: "Resíduo Flávio", n: 1, v: (l) => g(l, "res_fla") ?? 0, f: (l) => (g(l, "res_fla") == null ? "—" : pp(g(l, "res_fla"))) },
        { t: "Motivo", v: (l) => g(l, "motivos").join(" "), f: (l) => g(l, "motivos").map((m) => `<span class="chip">${esc(MOTIVOS[m])}</span>`).join("") },
        { t: "Urna", v: (l) => g(l, "urna") || "", f: (l) => esc(g(l, "urna") || "—") },
      ] }); },
    redesenhar() { this.t && this.t.redesenhar(); },
  };
  tabSusp.atualizar();
  desenharRecorte();
}

// ---------- metodologia ----------
function htmlMetodo() {
  const R = D.resumo;
  return `<section class="bloco" id="metodo"><div class="bloco-cab"><div><span class="olho">Como foi calculado</span><h2>Metodologia e fontes</h2></div></div>
  <div class="metodo">
    <p><b>Resultados.</b> Todos os votos, brancos, nulos, abstenções e aptos são os números oficiais do TSE (Portal de Dados Abertos, arquivos <span class="mono">votacao_secao</span>, <span class="mono">detalhe_votacao_secao</span> e <span class="mono">votacao_candidato_munzona</span> de 2026). A soma das ${n0(R.secoes)} seções confere exatamente com os totais oficiais. Nulos incluem os nulos técnicos.</p>
    <p><b>Migração de votos é uma estimativa.</b> O voto é secreto, então não existe registro de como cada eleitor votou nos dois turnos. A migração é estimada por inferência ecológica: em cada seção, a composição do 2º turno é modelada como uma combinação da composição do 1º. A matriz de transição (que fração de cada escolha do 1º turno foi para cada opção do 2º) é obtida por mínimos quadrados ponderados pelo eleitorado da seção, com cada linha somando 100% e sem valores negativos.</p>
    <p><b>Brasil, estados e municípios.</b> Cada estado tem sua própria matriz, estimada com as suas seções. O Brasil e as regiões somam os fluxos de cada estado. Nos municípios, a estimativa é combinada com a do estado: quanto menos seções o município tem, mais ela se aproxima do padrão estadual.</p>
    <p><b>Incerteza.</b> Os intervalos de 90% vêm de um bootstrap das seções e medem só a variação amostral, por isso são estreitos. A principal fonte de incerteza é a premissa de que eleitores com a mesma escolha no 1º turno se comportam de modo parecido dentro do estado. Para dar uma ideia dela, a tabela da matriz mostra também a estimativa feita com zonas eleitorais em vez de seções: onde as duas divergem (por exemplo, nos eleitores de Renan Santos), leia a estimativa como uma faixa. Fluxos dos finalistas, de brancos, nulos e abstenção e o total dos eliminados são os mais estáveis.</p>
    <p><b>Código e dados.</b> <a href="https://github.com/adriano-atanes/analise-eleicao-presidente-2026" target="_blank" rel="noopener">github.com/adriano-atanes/analise-eleicao-presidente-2026</a>. Dados gerados em ${esc(R.gerado_em)}.</p>
  </div></section>`;
}

// ---------- roteamento ----------
function trilha(partes) {
  document.getElementById("trilha").innerHTML = partes.map(([t, h], i) => (i === partes.length - 1 ? `<b>${esc(t)}</b>` : `<a href="#${h}">${esc(t)}</a><span aria-hidden="true">›</span>`)).join("");
}
async function rotear() {
  limparGraficos(); lerTema();
  const app = document.getElementById("app"); const h = location.hash.slice(1);
  try {
    let m;
    if ((m = h.match(/^uf-([A-Z]{2})$/))) { trilha([["Brasil", ""], [D.resumo.ufs[m[1]]?.nome || m[1], h]]); await visaoUF(app, m[1]); }
    else if ((m = h.match(/^mun-([A-Z]{2})-(\d+)$/))) {
      const nome = D.resumo.indice_municipios.find((x) => x[0] === m[1] && x[1] === +m[2])?.[2] || m[2];
      trilha([["Brasil", ""], [D.resumo.ufs[m[1]]?.nome || m[1], "uf-" + m[1]], [nome, h]]); await visaoMunicipio(app, m[1], +m[2]);
    } else if (h === "auditoria") { trilha([["Brasil", ""], ["Auditoria", h]]); await visaoAuditoria(app); }
    else { trilha([["Brasil", ""]]); visaoBrasil(app); }
    document.getElementById("nav-aud").toggleAttribute("aria-current", h === "auditoria");
    if (h === "auditoria") document.getElementById("nav-aud").setAttribute("aria-current", "page");
  } catch (e) { console.error(e); app.innerHTML = `<p class="aviso">Não foi possível carregar os dados (${esc(e.message)}). Recarregue a página.</p>`; }
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", rotear);

// re-renderiza quando o tema muda
const mq = matchMedia("(prefers-color-scheme: dark)");
mq.addEventListener("change", rotear);
new MutationObserver(rotear).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

// ---------- busca de municípios ----------
(function busca() {
  const inp = document.getElementById("busca"), ul = document.getElementById("busca-lista");
  const norm = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  let res = [], ativo = 0;
  function mostrar() {
    ul.innerHTML = res.map((r, i) => `<li><button class="${i === ativo ? "ativo" : ""}" data-i="${i}">${esc(r[2])}<small>${r[0]}</small></button></li>`).join("");
    ul.hidden = res.length === 0;
  }
  inp.addEventListener("input", () => {
    const q = norm(inp.value.trim()); ativo = 0;
    if (q.length < 2 || !D.resumo) { res = []; return mostrar(); }
    res = D.resumo.indice_municipios.filter((r) => norm(r[2]).includes(q)).sort((a, b) => norm(a[2]).indexOf(q) - norm(b[2]).indexOf(q) || a[2].localeCompare(b[2])).slice(0, 12);
    mostrar();
  });
  const ir = (r) => { location.hash = `mun-${r[0]}-${r[1]}`; inp.value = ""; res = []; mostrar(); inp.blur(); };
  inp.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { ativo = Math.min(res.length - 1, ativo + 1); mostrar(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { ativo = Math.max(0, ativo - 1); mostrar(); e.preventDefault(); }
    else if (e.key === "Enter" && res[ativo]) ir(res[ativo]);
    else if (e.key === "Escape") { res = []; mostrar(); }
  });
  ul.addEventListener("mousedown", (e) => { const b = e.target.closest("button"); if (b) { e.preventDefault(); ir(res[+b.dataset.i]); } });
  inp.addEventListener("blur", () => setTimeout(() => { ul.hidden = true; }, 150));
})();

(async function iniciar() {
  try { D.resumo = await json("dados/resumo.json"); }
  catch (e) { document.getElementById("app").innerHTML = `<p class="aviso">Não foi possível carregar os dados (${esc(e.message)}).</p>`; return; }
  rotear();
})();
</script>
